# dcert diagnostics knowledge base.
#
# Each entry describes one failure signature seen when probing an endpoint
# that sits behind Amazon CloudFront, behind a forward web proxy, or behind a
# TLS inspecting proxy. The matching engine (src/diagnose.rs) scores every
# entry against the evidence captured by a `dcert check` run: TLS handshake
# errors, the negotiated session, the certificate chain, the HTTP status,
# headers and body excerpt, the proxy CONNECT response and the proxy
# environment.
#
# Signals: every signal has an optional `required: true` (the entry cannot
# match without it) and an optional `weight` (default 1). Confidence is
# entry weight multiplied by the share of signal weight that matched.
#
# Layers, in the order the engine attributes a failure:
#   local_proxy_env  proxy_connect  tls_handshake  viewer_mtls  interception
#   edge_http  gateway_http  origin_http
#
# Operators can add or override entries with `--kb-file` or DCERT_KB_FILE;
# an entry with the same id replaces the built in one. Validate a file with
# `dcert kb validate <file>`.
version: 1
entries:
  # ---------------------------------------------------------------------
  # Local proxy environment
  # ---------------------------------------------------------------------
  - id: proxy.env.https-without-https-proxy
    title: HTTPS target but only HTTP_PROXY is set
    layer: local_proxy_env
    category: proxy
    weight: 0.9
    signals:
      - type: https_proxy_missing_http_set
        required: true
      - type: error
        pattern: '(?i)connect|timed out|handshake|refused|unreachable'
    root_cause: >
      HTTP_PROXY (or http_proxy) is set but HTTPS_PROXY and ALL_PROXY are not.
      dcert, like curl, does not route HTTPS traffic through HTTP_PROXY alone,
      so the connection went direct and was blocked by egress rules, while
      other tools on the same host may be tunnelling through the proxy.
    remediation:
      - Export HTTPS_PROXY (or ALL_PROXY) with the same value as HTTP_PROXY.
      - Or pass --proxy <url> for this run.
      - Check NO_PROXY does not accidentally match the target.
    references:
      - https://everything.curl.dev/usingcurl/proxies/env

  - id: proxy.env.proxy-unreachable
    title: Configured forward proxy is unreachable
    layer: local_proxy_env
    category: proxy
    weight: 0.9
    signals:
      - type: proxy_configured
        value: true
        required: true
      - type: error
        pattern: '(?i)failed to (connect to|resolve) proxy'
        required: true
    root_cause: >
      A forward proxy is configured for this target but the TCP connection
      to the proxy itself failed or its hostname did not resolve. The
      destination was never contacted.
    remediation:
      - Verify the proxy host and port in HTTPS_PROXY, ALL_PROXY or --proxy.
      - Confirm the proxy is reachable from this network segment.
      - If the target should bypass the proxy, add it to NO_PROXY or use --noproxy.
    references:
      - https://everything.curl.dev/usingcurl/proxies/env

  - id: proxy.env.tls-to-plain-proxy
    title: TLS spoken to a plain HTTP proxy port
    layer: local_proxy_env
    category: proxy
    weight: 0.85
    signals:
      - type: proxy_configured
        value: true
        required: true
      - type: error
        pattern: '(?i)wrong version number|unknown protocol|packet length too long'
        required: true
    root_cause: >
      The proxy URL uses https:// but the proxy listens for plain HTTP
      CONNECT, or the reverse. OpenSSL reports "wrong version number" when a
      TLS record is answered with an HTTP status line.
    remediation:
      - Use http:// in the proxy URL for a conventional CONNECT proxy.
      - Only use https:// when the proxy itself terminates TLS on that port.
    references:
      - https://everything.curl.dev/usingcurl/proxies/https

  # ---------------------------------------------------------------------
  # Proxy CONNECT responses
  # ---------------------------------------------------------------------
  - id: proxy.connect.407-auth-required
    title: Proxy requires authentication
    layer: proxy_connect
    category: proxy
    weight: 0.98
    signals:
      - type: proxy_status
        codes: [407]
        required: true
      - type: proxy_header
        name: proxy-authenticate
        pattern: '.+'
    root_cause: >
      The forward proxy answered the CONNECT request with 407 Proxy
      Authentication Required. The tunnel was never opened, so no TLS
      handshake with the destination took place. The Proxy-Authenticate
      header names the scheme the proxy accepts.
    remediation:
      - Add credentials to the proxy URL, e.g. http://user:pass@proxy:3128.
      - For NTLM or Kerberos only proxies, use a local authenticating helper such as cntlm or px.
      - Confirm the credentials belong to an account allowed to reach the destination.
    references:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/407

  - id: proxy.connect.403-policy
    title: Proxy policy denies the destination
    layer: proxy_connect
    category: proxy
    weight: 0.95
    signals:
      - type: proxy_status
        codes: [403]
        required: true
    root_cause: >
      The proxy accepted the credentials (or needed none) but refused to open
      a tunnel to this host and port. This is an access policy decision on
      the proxy, typically a category block, an unlisted destination or a
      blocked port.
    remediation:
      - Ask the proxy team to allow list the destination host and port 443.
      - Check whether the proxy only permits CONNECT to port 443 and the target uses another port.
    references:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/403

  - id: proxy.connect.5xx-upstream
    title: Proxy could not reach the destination
    layer: proxy_connect
    category: proxy
    weight: 0.9
    signals:
      - type: proxy_status
        codes: [502, 503, 504]
        required: true
      - type: proxy_header
        name: x-squid-error
        pattern: '.+'
        weight: 2
      - type: proxy_header
        name: via
        pattern: '.+'
    root_cause: >
      The proxy accepted the CONNECT but failed to connect to or resolve the
      destination on your behalf. An X-Squid-Error header such as
      ERR_DNS_FAIL or ERR_CONNECT_FAIL names the exact cause on Squid based
      proxies; other vendors put it in the body.
    remediation:
      - Resolve the destination name from the proxy's network, not from your workstation.
      - Check the proxy's own egress rules and upstream proxy chain.
      - Retry after confirming the destination is up from another vantage point.
    references:
      - https://wiki.squid-cache.org/SquidFaq/SquidLogs

  - id: proxy.connect.method-not-allowed
    title: Proxy does not accept CONNECT
    layer: proxy_connect
    category: proxy
    weight: 0.9
    signals:
      - type: proxy_status
        codes: [400, 405, 501]
        required: true
    root_cause: >
      The endpoint configured as a proxy answered the CONNECT request with a
      client error. It is either not a forward proxy at all, a reverse proxy
      or web server, or a proxy that only supports plain HTTP forwarding and
      not tunnelling.
    remediation:
      - Confirm the proxy address and port belong to a forward (CONNECT capable) proxy.
      - Some vendors expose CONNECT on a different port than plain HTTP proxying.
    references:
      - https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods/CONNECT

  - id: proxy.connect.captive-portal
    title: Captive portal or login page in place of the tunnel
    layer: proxy_connect
    category: proxy
    weight: 0.8
    signals:
      - type: proxy_status
        codes: [200, 302, 303, 307]
      - type: error
        pattern: '(?i)wrong version number|http request'
        required: true
      - type: proxy_configured
        value: false
    root_cause: >
      The TLS handshake was answered with an HTTP response. A transparent
      proxy or captive portal on this network intercepts port 443 and returns
      a login or block page instead of forwarding the connection.
    remediation:
      - Open a browser to complete the network login, then retry.
      - On a corporate network, confirm the device is enrolled with the web gateway.
    references:
      - https://www.rfc-editor.org/rfc/rfc8910

  # ---------------------------------------------------------------------
  # TLS handshake with the edge
  # ---------------------------------------------------------------------
  - id: tls.handshake.protocol-version
    title: Server rejected the offered TLS versions
    layer: tls_handshake
    category: tls
    weight: 0.9
    signals:
      - type: error
        pattern: '(?i)protocol version|no protocols available|unsupported protocol'
        required: true
    root_cause: >
      The server and client share no TLS protocol version. CloudFront viewer
      security policies TLSv1.2_2018 and later refuse TLS 1.0 and 1.1; a
      client pinned to an old version, or a server still limited to TLS 1.0,
      cannot negotiate.
    remediation:
      - Retry with --min-tls 1.2 (the default) and no --max-tls override.
      - If the server only offers TLS 1.0 or 1.1, that is the finding; it must be upgraded.
      - On CloudFront, check the distribution security policy.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html

  - id: tls.handshake.no-shared-cipher
    title: No cipher suite in common
    layer: tls_handshake
    category: tls
    weight: 0.85
    signals:
      - type: error
        pattern: '(?i)handshake failure|no shared cipher|no cipher match'
        required: true
      - type: client_auth_required
        negate: true
    root_cause: >
      The handshake was aborted with a generic handshake failure and no
      client certificate was requested, which usually means no cipher suite
      or signature algorithm was acceptable to both sides. Restrictive
      --ciphers values, a legacy origin, or a CloudFront security policy
      that dropped CBC suites are common causes.
    remediation:
      - Retry without --ciphers or --cipher-list to use the defaults.
      - Compare the server's cipher list against the CloudFront security policy table.
      - For an origin behind CloudFront, ensure it offers at least one CloudFront supported ECDHE cipher.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html

  - id: tls.handshake.sni-required
    title: Hostname not served on this connection
    layer: tls_handshake
    category: tls
    weight: 0.85
    signals:
      - type: error
        pattern: '(?i)unrecognized name|tlsv1 alert internal error|handshake failure'
        required: true
      - type: sni_overridden
    root_cause: >
      The server could not select a certificate for the requested name.
      CloudFront distributions on shared addresses require SNI, and a
      hostname that is not an alternate domain name of any distribution is
      refused at the handshake.
    remediation:
      - Check the SNI value (see --sni) matches an alternate domain configured on the distribution.
      - Add the hostname as a CNAME on the distribution and attach a certificate that covers it.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html

  - id: tls.handshake.default-cloudfront-cert
    title: CloudFront served its default certificate
    layer: tls_handshake
    category: cloudfront
    weight: 0.9
    signals:
      - type: chain_name
        pattern: '(?i)\*\.cloudfront\.net'
        required: true
      - type: target_host
        pattern: '(?i)\.cloudfront\.net$'
        negate: true
        required: true
      - type: verify_result
        pattern: '(?i)hostname|mismatch|name'
    root_cause: >
      The distribution answered with the default *.cloudfront.net certificate
      although a custom hostname was requested. Either the hostname is not
      listed as an alternate domain name on the distribution, or no ACM
      certificate covering it is attached, so hostname verification fails.
    remediation:
      - Add the hostname under Alternate domain names (CNAMEs) on the distribution.
      - Attach an ACM certificate in us-east-1 that covers the hostname.
      - Confirm DNS points at this distribution and not another one.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html

  - id: tls.handshake.chain-incomplete
    title: Server sent an incomplete chain
    layer: tls_handshake
    category: tls
    weight: 0.85
    signals:
      - type: error
        pattern: '(?i)unable to get local issuer|unable to get issuer'
        required: true
      - type: chain_name
        pattern: '(?i)cloudfront|amazon'
        negate: true
    root_cause: >
      The leaf certificate's issuer was not in the presented chain and is not
      a root in the local trust store, so verification stops. Origins that
      install only the leaf certificate cause the same 502 from CloudFront.
    remediation:
      - Install the intermediate CA certificate(s) on the server alongside the leaf.
      - Re-run with --resolve-issuers to fetch the missing issuer via AIA and confirm the chain.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html

  # ---------------------------------------------------------------------
  # Viewer mTLS
  # ---------------------------------------------------------------------
  - id: mtls.viewer.certificate-required
    title: Server requires a client certificate
    layer: viewer_mtls
    category: mtls
    weight: 0.95
    signals:
      - type: client_auth_required
        required: true
      - type: client_cert_supplied
        negate: true
        required: true
      - type: chain_name
        pattern: '(?i)cloudfront|amazon'
        weight: 2
    root_cause: >
      The handshake was aborted because the server demanded a client
      certificate and none was offered. A CloudFront distribution with viewer
      mutual TLS in verify (required) mode rejects every connection without
      a certificate at the TLS layer; no HTTP status is returned.
    remediation:
      - Retry with --client-cert and --client-key (or --pkcs12) holding a certificate issued by a CA in the distribution's trust store.
      - For CloudFront, confirm the trust store attached to the distribution contains the issuing CA chain.
      - If anonymous access must keep working, switch the distribution to optional mode.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-authentication.html

  - id: mtls.viewer.unknown-ca
    title: Client certificate not trusted by the server
    layer: viewer_mtls
    category: mtls
    weight: 0.95
    signals:
      - type: client_cert_supplied
        required: true
      - type: error
        pattern: '(?i)unknown ca|unknown_ca|certificate unknown'
        required: true
    root_cause: >
      A client certificate was presented and the server rejected it with an
      unknown CA alert. On CloudFront viewer mTLS this means the certificate
      does not chain to any CA in the distribution's trust store, or the
      trust store bundle is missing an intermediate.
    remediation:
      - Upload the full issuing chain (root and intermediates) to the CloudFront trust store in S3 and refresh it.
      - Confirm the client certificate was issued by that CA and not a sibling CA.
      - Send the intermediate along with the leaf (--client-cert file may contain both).
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/trust-stores-certificate-management.html

  - id: mtls.viewer.certificate-expired
    title: Client certificate expired
    layer: viewer_mtls
    category: mtls
    weight: 0.95
    signals:
      - type: client_cert_supplied
        required: true
      - type: error
        pattern: '(?i)certificate expired|certificate_expired'
        required: true
    root_cause: >
      The server rejected the client certificate because its validity period
      has ended. CloudFront viewer mTLS rejects expired client certificates
      unless the distribution has Ignore certificate expiration enabled.
    remediation:
      - Renew the client certificate from the issuing CA.
      - As a temporary measure for devices that cannot be updated, enable Ignore certificate expiration on the distribution.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-validation-modes.html

  - id: mtls.viewer.bad-certificate
    title: Client certificate rejected
    layer: viewer_mtls
    category: mtls
    weight: 0.85
    signals:
      - type: client_cert_supplied
        required: true
      - type: error
        pattern: '(?i)bad certificate|certificate revoked|unsupported certificate|access denied|decrypt error'
        required: true
    root_cause: >
      The client certificate was received but refused after validation. On
      CloudFront viewer mTLS this covers a certificate reported revoked (or
      undetermined, which denies by default) by OCSP when it is enabled on
      the trust store, a certificate whose serial number a Connection
      Function found in its KeyValueStore revocation list or that the
      function denied for any other custom reason, a chain deeper than four
      certificates or larger than the size limit, a key usage that does not
      include client authentication, an unsupported key or signature
      algorithm, or a mismatch between the certificate and the private key.
      Connection logs record the exact reason code (ClientCertRejected,
      ClientCertMaxChainDepthExceeded, ClientCertTypeUnsupported and so on).
    remediation:
      - Check the certificate has the TLS client authentication extended key usage and an RSA 2048+ or P-256/P-384 key.
      - If OCSP is enabled on the trust store, confirm every certificate below the trust anchor carries an OCSP URL and that the responder is reachable.
      - Check the serial number is not in the Connection Function's KeyValueStore revocation list.
      - Verify the key matches the certificate with dcert verify-key, and read the distribution's connection logs for the reason code.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/certificate-revocation.html
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/connection-logs.html

  - id: mtls.viewer.optional-mode-origin-rejects
    title: Handshake succeeded but the origin rejected the identity
    layer: edge_http
    category: mtls
    weight: 0.75
    signals:
      - type: header
        name: server
        pattern: '(?i)cloudfront'
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)miss from cloudfront'
        required: true
      - type: status
        codes: [401, 403]
        required: true
      - type: client_cert_supplied
    root_cause: >
      CloudFront accepted the connection (optional or passthrough viewer mTLS)
      and forwarded the request, and the origin answered 401 or 403. The
      origin expects the CloudFront-Viewer-Cert-* or Client-Cert headers and
      either did not receive them or rejected their content.
    remediation:
      - Allow list CloudFront-Viewer-Cert-Present, Subject, Issuer, Serial-Number, Sha256, Validity and Pem in the origin request policy.
      - In passthrough mode allow list Client-Cert and Client-Cert-Chain instead, and decode the URL encoded PEM at the origin.
      - Compare the origin's expected header names with what the cache policy forwards.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html

  # ---------------------------------------------------------------------
  # TLS interception
  # ---------------------------------------------------------------------
  - id: interception.vendor-ca
    title: TLS inspection proxy re signed the connection
    layer: interception
    category: interception
    weight: 0.95
    signals:
      - type: chain_name
        pattern: '(?i)zscaler|netskope|umbrella|fortinet|fortigate|palo alto|blue ?coat|proxysg|forcepoint|websense|mcafee web gateway|skyhigh|sophos|check ?point|menlo|iboss|cloudflare gateway|global secure access|mitmproxy|charles|fiddler|burp|cisco secure|symantec .*proxy|websecurity'
        required: true
      - type: root_class
        is: private_pki
    root_cause: >
      The certificate chain was issued by a known TLS inspection product,
      not by the destination's CA. A forward proxy or endpoint agent is
      terminating TLS, inspecting the traffic and re signing it. Everything
      dcert reports about the chain describes the proxy, not the real
      endpoint; CloudFront or origin certificate details are invisible.
    remediation:
      - Trust the inspection CA for tooling (SSL_CERT_FILE or --ca-cert) or ask for the destination to be exempted from inspection.
      - Compare with a direct probe using --connect-to to the real edge address to see the genuine chain.
      - Client certificate (mTLS) flows cannot pass through an inspecting proxy; request a bypass for mTLS endpoints.
    references:
      - https://help.zscaler.com/zia/about-ssl-inspection

  - id: interception.private-root-public-host
    title: Public hostname chains to a private root
    layer: interception
    category: interception
    weight: 0.7
    signals:
      - type: public_hostname
        required: true
      - type: root_class
        is: private_pki
        required: true
      - type: chain_name
        pattern: '(?i)zscaler|netskope|umbrella|fortinet|fortigate|palo alto|blue ?coat|proxysg|forcepoint|mcafee|skyhigh|sophos|check ?point|menlo|iboss|cloudflare gateway|global secure access|mitmproxy|charles|fiddler|burp'
        negate: true
    root_cause: >
      A public internet hostname presented a certificate that anchors to a
      private CA. Unless the organisation deliberately runs this host on a
      private PKI, an inspecting proxy or a transparent gateway is re signing
      the traffic with an enterprise CA.
    remediation:
      - Inspect the root subject reported under root_trust; an enterprise or vendor name confirms interception.
      - Probe from a network without the gateway, or bypass it with --connect-to, and compare chains.
    references:
      - https://www.ndss-symposium.org/wp-content/uploads/2017/09/killed-proxy-analyzing-client-end-tls-interception-software.pdf

  # ---------------------------------------------------------------------
  # CloudFront edge generated HTTP errors
  # ---------------------------------------------------------------------
  - id: cloudfront.edge.cname-not-configured
    title: CloudFront alternate domain not configured
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [403, 400]
        required: true
      - type: header
        name: server
        pattern: '(?i)cloudfront'
        required: true
      - type: body
        pattern: "(?i)bad request\\. we can't connect to the server for this app or website"
        required: true
        weight: 3
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
    root_cause: >
      The request reached CloudFront but no distribution claims the Host
      header. DNS points at CloudFront, yet the hostname is not listed as an
      alternate domain name on any distribution, so the edge answers with
      its generic bad request page.
    remediation:
      - Add the hostname under Alternate domain names (CNAMEs) on the intended distribution.
      - Attach an ACM certificate that covers the hostname.
      - Check the DNS record targets the right distribution domain.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-403-permission-denied.html

  - id: cloudfront.edge.waf-blocked
    title: Request blocked by AWS WAF
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [403]
        required: true
      - type: header
        name: server
        pattern: '(?i)cloudfront'
        required: true
      - type: body
        pattern: '(?i)request blocked'
        required: true
        weight: 3
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
    root_cause: >
      An AWS WAF web ACL associated with the distribution blocked the request
      at the edge. The origin never saw it. Managed rule groups commonly
      trigger on missing or unusual User-Agent values, request size, or IP
      reputation.
    remediation:
      - Search the WAF sampled requests or logs for the X-Amz-Cf-Id value shown in the evidence.
      - Add a scoped rule exception or adjust the managed rule group action.
      - Retry with a browser like User-Agent header to confirm a bot control rule.
    references:
      - https://docs.aws.amazon.com/waf/latest/developerguide/web-acl-testing.html

  - id: cloudfront.edge.geo-restricted
    title: Geographic restriction
    layer: edge_http
    category: cloudfront
    weight: 0.98
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)configured to block access from your country'
        required: true
        weight: 3
      - type: header
        name: server
        pattern: '(?i)cloudfront'
    root_cause: >
      The distribution's geographic restriction denies the country the
      request came from. When probing through a proxy the country is that of
      the proxy egress, not of the workstation.
    remediation:
      - Adjust the allow or block list under Geographic restrictions on the distribution.
      - When probing through a proxy, check the proxy's egress country.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html

  - id: cloudfront.edge.signed-url-missing
    title: Signed URL or cookie missing
    layer: edge_http
    category: cloudfront
    weight: 0.98
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)missing key-pair-id|missing key pair id'
        required: true
        weight: 3
    root_cause: >
      The cache behaviour restricts viewer access with signed URLs or signed
      cookies and the request carried neither.
    remediation:
      - Generate a signed URL or cookie with a key in the distribution's trusted key group.
      - Confirm the path matches a cache behaviour that expects signing.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PrivateContent.html

  - id: cloudfront.edge.signed-url-invalid
    title: Signed URL rejected
    layer: edge_http
    category: cloudfront
    weight: 0.9
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)access denied|signature|expired|key-pair-id'
        required: true
      - type: header
        name: server
        pattern: '(?i)cloudfront'
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
        weight: 2
    root_cause: >
      CloudFront rejected the signed URL or cookie: the signature does not
      verify, the policy has expired, or the key pair is not in a trusted key
      group of the distribution.
    remediation:
      - Regenerate the signature with an unexpired policy and the correct private key.
      - Confirm the key id belongs to a key group attached to the distribution.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html

  - id: cloudfront.edge.origin-dns
    title: CloudFront cannot resolve the origin
    layer: edge_http
    category: cloudfront
    weight: 0.98
    signals:
      - type: status
        codes: [502]
        required: true
      - type: body
        pattern: "(?i)wasn't able to resolve the origin domain name"
        required: true
        weight: 3
    root_cause: >
      The origin domain name configured on the distribution does not resolve
      in public DNS. Private hosted zone names and internal hostnames are
      not reachable from CloudFront.
    remediation:
      - Fix or publish the origin DNS record in a public zone.
      - Use the origin's public DNS name, not an internal or split horizon name.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html

  - id: cloudfront.edge.origin-tls-failure
    title: CloudFront could not complete TLS with the origin
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [502]
        required: true
      - type: body
        pattern: '(?i)attempted to establish a connection with the origin, but either the attempt failed or the origin closed the connection'
        required: true
        weight: 3
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
    root_cause: >
      CloudFront reached the origin but the TLS negotiation failed or the
      origin closed the connection. The usual causes are an origin
      certificate whose names do not match the origin domain or Host header,
      an expired or self signed origin certificate, a missing intermediate,
      no cipher or protocol in common with CloudFront, an origin that demands
      a client certificate while origin mTLS is not enabled on the
      distribution, or a response header block over the CloudFront limit.
    remediation:
      - Probe the origin directly with dcert, using --connect-to if its DNS name differs, and read the diagnosis for that hop.
      - Ensure the origin certificate covers the Origin Domain and is issued by a publicly trusted CA with the full chain installed.
      - Ensure the origin offers TLS 1.2 or 1.3 with an ECDHE cipher CloudFront supports.
      - If the origin requires a client certificate, enable origin mTLS on the distribution with a certificate from ACM in us-east-1.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-mtls-authentication.html

  - id: cloudfront.edge.origin-timeout
    title: CloudFront timed out connecting to the origin
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [504]
        required: true
      - type: body
        pattern: "(?i)wasn't able to connect to the origin|origin.*timed out|gateway time-?out"
        required: true
        weight: 3
      - type: header
        name: server
        pattern: '(?i)cloudfront'
    root_cause: >
      CloudFront could not open a connection to the origin or the origin did
      not answer within the origin response timeout. Security groups,
      firewalls, an origin on a private address, or a slow origin are the
      usual reasons.
    remediation:
      - Allow inbound traffic from the CloudFront managed prefix list on the origin security group.
      - Confirm the origin is reachable from the public internet on the configured port.
      - Raise the origin response timeout for slow endpoints.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-504-gateway-timeout.html

  - id: cloudfront.edge.lambda-edge-invalid
    title: Lambda@Edge returned an invalid response
    layer: edge_http
    category: cloudfront
    weight: 0.98
    signals:
      - type: status
        codes: [502, 503]
        required: true
      - type: body
        pattern: '(?i)lambda function associated with the cloudfront distribution is invalid'
        required: true
        weight: 3
    root_cause: >
      A Lambda@Edge function attached to the cache behaviour returned a
      malformed response, exceeded a limit, or lacks the trust policy that
      lets CloudFront invoke it.
    remediation:
      - Validate the function response shape for the event type it handles.
      - Check the function's execution role trusts both lambda.amazonaws.com and edgelambda.amazonaws.com.
      - Review CloudWatch Logs in the region where the edge executed the function.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-edge-testing-debugging.html

  - id: cloudfront.edge.function-invalid
    title: CloudFront Function failed
    layer: edge_http
    category: cloudfront
    weight: 0.98
    signals:
      - type: status
        codes: [503, 502]
        required: true
      - type: body
        pattern: '(?i)cloudfront function associated with the cloudfront distribution is invalid'
        required: true
        weight: 3
    root_cause: >
      A CloudFront Function on the cache behaviour threw an error or
      exceeded its compute limit.
    remediation:
      - Test the function in the console with the failing request and inspect the error output.
      - Reduce work in the function or move it to Lambda@Edge.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/functions-test.html

  - id: cloudfront.edge.capacity
    title: CloudFront capacity exceeded
    layer: edge_http
    category: cloudfront
    weight: 0.9
    signals:
      - type: status
        codes: [503]
        required: true
      - type: body
        pattern: '(?i)capacity exceeded'
        required: true
        weight: 3
    root_cause: >
      The edge location could not serve the request because of capacity
      limits at that point of presence.
    remediation:
      - Retry; the condition is transient.
      - Open a support case with the request id if it persists.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html

  - id: cloudfront.edge.generic-error-page
    title: CloudFront edge error page
    layer: edge_http
    category: cloudfront
    weight: 0.6
    fallback: true
    signals:
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
        required: true
      - type: body
        pattern: '(?i)the request could not be satisfied'
        required: true
      - type: status
        codes: [400, 403, 404, 421, 500, 502, 503, 504]
    root_cause: >
      CloudFront generated this error at the edge (X-Cache says Error from
      cloudfront) but the body sentence did not match a more specific entry.
      The Request ID in the body and the X-Amz-Cf-Id header identify the
      request for AWS Support.
    remediation:
      - Read the sentence under "The request could not be satisfied" in the body excerpt (--show-body).
      - Quote the X-Amz-Cf-Id when contacting AWS Support.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-response-errors.html

  - id: cloudfront.edge.misdirected
    title: Connection reused for a hostname the certificate does not cover
    layer: edge_http
    category: cloudfront
    weight: 0.9
    signals:
      - type: status
        codes: [421]
        required: true
      - type: header
        name: server
        pattern: '(?i)cloudfront'
    root_cause: >
      The HTTP/2 connection was coalesced for a hostname that the
      certificate served on that connection does not cover, so the edge asks
      for a new connection.
    remediation:
      - Open a fresh connection per hostname, or use --http1.1.
      - Ensure every hostname sharing a connection is covered by the same certificate and distribution.
    references:
      - https://www.rfc-editor.org/rfc/rfc9113#section-9.1.2

  # ---------------------------------------------------------------------
  # Origin generated errors passed through the edge
  # ---------------------------------------------------------------------
  - id: cloudfront.origin.s3-access-denied
    title: S3 origin denied access
    layer: origin_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)<code>accessdenied</code>'
        required: true
        weight: 3
      - type: header
        name: x-cache
        pattern: '(?i)miss from cloudfront|error from cloudfront'
    root_cause: >
      The request passed the edge and Amazon S3 refused it. The bucket policy
      does not grant the distribution's origin access control (or legacy
      origin access identity), the object does not exist and listing is
      denied, or the object is encrypted with a KMS key the OAC cannot use.
    remediation:
      - Grant s3:GetObject to the CloudFront service principal with the distribution ARN condition in the bucket policy.
      - If the object may be missing, expect 403 in place of 404 unless s3:ListBucket is granted.
      - For SSE-KMS objects, allow the CloudFront service principal in the key policy.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html

  - id: cloudfront.origin.s3-not-found
    title: S3 object or bucket not found
    layer: origin_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [404]
        required: true
      - type: body
        pattern: '(?i)<code>nosuchkey</code>|<code>nosuchbucket</code>'
        required: true
        weight: 3
    root_cause: >
      S3 answered that the key or bucket does not exist. The origin path or
      the default root object on the distribution does not match the bucket
      layout.
    remediation:
      - Check the origin path prefix and the default root object.
      - Confirm the bucket name and region in the origin domain.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DefaultRootObject.html

  - id: cloudfront.origin.api-gateway-error
    title: API Gateway returned an error
    layer: gateway_http
    category: api_gateway
    weight: 0.7
    fallback: true
    signals:
      - type: header
        name: x-amzn-errortype
        pattern: '.+'
        required: true
        weight: 2
      - type: status
        codes: [400, 401, 403, 404, 413, 415, 429, 500, 502, 503, 504]
    root_cause: >
      The response carries an x-amzn-ErrorType header, so it was generated
      by Amazon API Gateway itself (a gateway response) rather than by the
      integration behind it, either directly or as the origin of the
      distribution. The header value names the reason; run
      `dcert kb explain x-amzn-errortype` for the full table.
    remediation:
      - Behind CloudFront, set the origin path to the API stage name and forward the Authorization and x-api-key headers in the origin request policy.
      - Check the API resource policy allows the caller (or the CloudFront distribution and the public internet).
      - Enable execution and access logging on the stage to see the gateway response type.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - https://repost.aws/knowledge-center/api-gateway-cloudfront-distribution

  - id: cloudfront.origin.error-forwarded
    title: Origin error forwarded by CloudFront
    layer: origin_http
    category: cloudfront
    weight: 0.6
    fallback: true
    signals:
      - type: header
        name: via
        pattern: '(?i)cloudfront'
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)miss from cloudfront|refreshhit from cloudfront'
        required: true
      - type: status
        codes: [400, 401, 403, 404, 405, 429, 500, 501, 502, 503, 504]
        required: true
    root_cause: >
      The request went through CloudFront (Via header) and the status was
      produced by the origin, not the edge (X-Cache is a miss, not an edge
      error). Investigate the origin directly; the edge is healthy.
    remediation:
      - Probe the origin directly with dcert, bypassing CloudFront with --connect-to if the origin has a separate name.
      - Check origin logs for the X-Amz-Cf-Id value.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-response-errors.html

  - id: cloudfront.origin.mtls-not-enabled
    title: Origin demands a client certificate that CloudFront does not present
    layer: origin_http
    category: mtls
    weight: 0.8
    signals:
      - type: status
        codes: [502]
        required: true
      - type: body
        pattern: '(?i)attempted to establish a connection with the origin'
        required: true
      - type: target_host
        pattern: '(?i)origin|backend|api'
    root_cause: >
      The 502 sentence indicates a failed TLS negotiation with the origin.
      When a direct probe of the origin reports client certificate required
      (exit code 6), the origin enforces mTLS and origin mutual TLS is not
      enabled on the distribution, or the certificate CloudFront presents is
      not trusted by the origin.
    remediation:
      - Probe the origin directly; if dcert reports client certificate required, enable origin mTLS on the distribution.
      - Import a client certificate with the TLS client authentication EKU into ACM in us-east-1 and attach it to the origin.
      - Add the certificate's issuing CA chain to the origin's trust store (ALB trust store, nginx ssl_client_certificate, or API Gateway truststore).
      - Track expiry; imported ACM certificates are not renewed automatically.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-mtls-authentication.html
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-certificate-management-certificate-manager.html

  # ---------------------------------------------------------------------
  # Informational findings on a healthy CloudFront response
  # ---------------------------------------------------------------------
  - id: cloudfront.info.served-by-cloudfront
    title: Endpoint is served through CloudFront
    layer: edge_http
    category: cloudfront
    weight: 0.5
    signals:
      - type: header
        name: via
        pattern: '(?i)cloudfront'
        required: true
      - type: header
        name: x-amz-cf-pop
        pattern: '.+'
      - type: status
        codes: [200, 201, 204, 301, 302, 304, 307, 308]
        required: true
    root_cause: >
      The response passed through a CloudFront edge and completed
      successfully. The certificate chain shown belongs to the distribution,
      not to the origin; the origin's own certificate and any origin mTLS
      configuration are not visible from this vantage point.
    remediation:
      - To inspect the origin certificate, probe the origin hostname directly.
      - Use the X-Amz-Cf-Pop and X-Amz-Cf-Id values when correlating with CloudFront logs.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-response-errors.html

  # ---------------------------------------------------------------------
  # CloudFront edge: additional edge generated responses
  # (from the CloudFront Developer Guide and AWS Knowledge Center, 2026-09)
  # ---------------------------------------------------------------------
  - id: cloudfront.edge.method-not-allowed
    title: HTTP method not allowed by the cache behaviour
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)not configured to allow the http request method'
        required: true
        weight: 3
    root_cause: >
      The cache behaviour only forwards GET and HEAD (optionally OPTIONS)
      and the request used another method. CloudFront answers 403 at the
      edge without contacting the origin.
    remediation:
      - Set Allowed HTTP methods on the behaviour to GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE.
      - When enabling write methods on an S3 origin, restrict the bucket policy so viewers cannot delete objects.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-403-invalid-method.html

  - id: cloudfront.edge.uri-too-long
    title: URL exceeds the CloudFront limit
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [414]
        required: true
      - type: header
        name: server
        pattern: '(?i)cloudfront'
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
    root_cause: >
      CloudFront constructs a URL from the request and refuses any longer
      than 8,192 bytes with 414, then closes the TCP connection. The origin
      was not contacted.
    remediation:
      - Shorten the path or query string; move large parameters into a POST body.
      - Remember the whole request including headers is capped at 32,768 bytes.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-limits.html

  - id: cloudfront.edge.header-too-large
    title: Request headers exceed the CloudFront limit
    layer: edge_http
    category: cloudfront
    weight: 0.95
    signals:
      - type: status
        codes: [494]
        required: true
    root_cause: >
      CloudFront returns the non standard status 494 when a request exceeds
      32,768 bytes because of its headers (large cookies, long bearer
      tokens, many custom headers), and then terminates the connection.
    remediation:
      - Trim cookies scoped to the distribution's domain and shorten tokens.
      - Check the request with --debug to see the header block dcert sent.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html

  - id: cloudfront.edge.function-or-origin-mtls-503
    title: Edge generated 503 (edge function error or origin mTLS pause)
    layer: edge_http
    category: cloudfront
    weight: 0.75
    signals:
      - type: status
        codes: [503]
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
        required: true
      - type: body
        pattern: '(?i)capacity exceeded'
        negate: true
        required: true
      - type: body
        pattern: '(?i)request could not be satisfied'
    root_cause: >
      A 503 marked Error from cloudfront that is not the capacity page was
      produced by the edge: a Lambda@Edge or CloudFront Function raised an
      unhandled exception, Lambda@Edge hit its concurrency or invocation
      quota in the Region, or the distribution uses origin mTLS and
      CloudFront paused traffic after repeatedly failing to complete the
      mutual TLS handshake with the origin (expired or untrusted ACM client
      certificate, origin unreachable). The origin mTLS pause clears on its
      own once handshakes succeed again.
    remediation:
      - Check Lambda@Edge and CloudFront Functions logs in the Region that served the request for exceptions and throttles.
      - With origin mTLS enabled, confirm the ACM client certificate has not expired and that the origin trusts its issuing CA; allow time for a replaced certificate to propagate.
      - Probe the origin directly with a client certificate to confirm it completes the handshake.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html
      - https://repost.aws/knowledge-center/lambda-edge-500-errors
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-mtls-authentication.html

  - id: cloudfront.edge.stale-viewer-certificate
    title: CloudFront edge still serves an expired viewer certificate
    layer: tls_handshake
    category: cloudfront
    weight: 0.8
    signals:
      - type: chain_name
        pattern: '(?i)amazon|cloudfront'
        required: true
      - type: verify_result
        pattern: '(?i)expired'
        weight: 2
      - type: error
        pattern: '(?i)expired'
      - type: public_hostname
    root_cause: >
      The certificate presented by the edge chains to Amazon but has
      expired. ACM renewals and reimports are applied to CloudFront
      asynchronously and can take up to 24 hours, during which some edge
      locations keep serving the previous certificate; a renewal completed
      within the last day, or a reimport under a different ARN that was
      never attached to the distribution, both look like this.
    remediation:
      - Confirm the ARN attached to the distribution (aws cloudfront get-distribution --query ...ViewerCertificate.ACMCertificateArn) is the renewed certificate.
      - Force a redeploy by switching the distribution to another certificate covering the same names and back.
      - Renew or reimport at least 24 hours before NotAfter in future.
    references:
      - https://repost.aws/knowledge-center/acm-certificate-not-appearing-cloudfront
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html

  - id: tls.handshake.cloudfront-security-policy
    title: CloudFront security policy rejected the offered TLS version or ciphers
    layer: tls_handshake
    category: tls
    weight: 0.97
    signals:
      - type: error
        pattern: '(?i)protocol version|handshake failure|no protocols available|unsupported protocol'
        required: true
      - type: target_host
        pattern: '(?i)\.cloudfront\.net$'
        required: true
        weight: 2
      - type: client_auth_required
        negate: true
    root_cause: >
      The handshake failed before a certificate was received against a
      CloudFront host. The distribution's security policy sets the minimum
      viewer TLS version and cipher list (TLSv1.2_2021 and later drop CBC
      ciphers, TLSv1.3_2025 accepts only TLS 1.3), so a client limited to
      TLS 1.0 or 1.1, or to CBC or static RSA suites, is refused with a
      protocol_version or handshake_failure alert.
    remediation:
      - Retry with --tls-version and --ciphers matching the policy (TLS 1.2 with ECDHE AES-GCM or TLS 1.3 suites).
      - If legacy clients must be supported, lower the security policy on the distribution.
    references:
      - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html
      - https://repost.aws/knowledge-center/cloudfront-ssl-connection-errors

  # ---------------------------------------------------------------------
  # API Gateway: gateway responses (generated without calling the integration)
  # ---------------------------------------------------------------------
  - id: apigateway.gateway.missing-authentication-token
    title: API Gateway found no resource or method for the request
    layer: gateway_http
    category: api_gateway
    weight: 0.98
    signals:
      - type: status
        codes: [403]
        required: true
      - type: body
        pattern: '(?i)missing authentication token'
        required: true
        weight: 3
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^MissingAuthenticationTokenException'
    root_cause: >
      Despite its wording, this gateway response means the deployed API
      has no resource and method matching the request path, or the
      request carried no token to a method that expects one. Typical
      causes are a missing or wrong stage name, a path that was never
      deployed, a method the resource does not define, or a custom domain
      URL that repeats the stage the API mapping already supplies. Behind
      CloudFront the same result appears when the origin path does not
      name the stage.
    remediation:
      - Invoke the stage URL directly (https://<api-id>.execute-api.<region>.amazonaws.com/<stage>/<path>) to rule out custom domain mappings.
      - Check the method exists on the resource and that the latest deployment was pushed to the stage.
      - On a custom domain, drop the stage from the URL; behind CloudFront, set Origin Path to /<stage>.
    references:
      - https://repost.aws/knowledge-center/api-gateway-403-custom-domain
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html

  - id: apigateway.gateway.forbidden-mtls
    title: API Gateway mutual TLS rejected the client certificate
    layer: gateway_http
    category: mtls
    weight: 0.9
    signals:
      - type: status
        codes: [403]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^ForbiddenException'
        required: true
      - type: client_cert_supplied
        required: true
        weight: 2
      - type: body
        pattern: '(?i)"message"\s*:\s*"forbidden"'
    root_cause: >
      Unlike CloudFront, API Gateway completes the TLS handshake and then
      denies the request with 403 Forbidden when the client certificate is
      not acceptable to the custom domain's truststore: the issuer or an
      intermediate is missing from the bundle, the certificate uses a
      signature algorithm weaker than SHA-256 / RSA-2048 / ECDSA-256, it is
      expired, or it is self signed and not itself in the truststore.
      Execution logs record "Access denied. Reason: Could not find issuer
      for certificate", "Client cert using an insecure Signature
      Algorithm" or "self signed certificate".
    remediation:
      - Verify the chain locally with openssl verify -CAfile truststore.pem client.pem (add -untrusted intermediate.pem when the bundle has intermediates).
      - Upload a truststore that contains the complete chain from issuing CA to root and update the domain name to the new truststore version.
      - Enable execution logging on a REST API mapped to the domain to read the Access denied reason; HTTP APIs have no execution logs.
      - "If the same 403 appears without --client-cert, the cause is not mTLS: check API key, WAF, resource policy, stage and mapping."
    references:
      - https://repost.aws/knowledge-center/api-gateway-mutual-tls-403-errors
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-mutual-tls.html

  - id: apigateway.gateway.forbidden
    title: API Gateway refused the request (Forbidden)
    layer: gateway_http
    category: api_gateway
    weight: 0.85
    signals:
      - type: status
        codes: [403]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^ForbiddenException'
        required: true
        weight: 2
      - type: client_cert_supplied
        negate: true
    root_cause: >
      ForbiddenException is the catch all 403 from API Gateway. The usual
      causes, in order of frequency: the method requires an API key and
      x-api-key is missing, wrong, disabled or not attached to a usage plan
      for this stage; AWS WAF blocked the request; a private API was called
      through public DNS without the Host or x-apigw-api-id header, or a
      public API was called from a VPC whose execute-api endpoint has
      private DNS enabled; the custom domain has no base path mapping for
      this path; the stage in the URL does not exist; the default
      execute-api endpoint was disabled and the request did not use the
      custom domain; or the custom domain requires mutual TLS and no
      trusted client certificate was presented.
    remediation:
      - Send x-api-key if the method requires an API key, and confirm the key is in a usage plan attached to the stage.
      - Check the AWS WAF web ACL sampled requests for a block.
      - From a VPC, check whether the execute-api interface endpoint has private DNS enabled; public APIs then need a custom domain.
      - Confirm the API mapping (base path and stage) for custom domains, and whether the default endpoint is disabled.
      - For an mTLS custom domain, retry with --client-cert and --client-key.
    references:
      - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - https://repost.aws/knowledge-center/api-gateway-vpc-connections

  - id: apigateway.gateway.access-denied
    title: API Gateway authorization denied the caller
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [403]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^AccessDeniedException'
        required: true
        weight: 2
      - type: body
        pattern: '(?i)not authorized|security token included in the request is invalid'
    root_cause: >
      The IAM authorizer, the API resource policy or a Lambda authorizer
      denied execute-api:Invoke. The message says which: "with an explicit
      deny in a resource-based policy" (Deny statement), "because no
      resource-based policy allows" (implicit deny, typical for private APIs
      called from a VPC endpoint the policy does not list), "User:
      anonymous" (no credentials or the caller was not evaluated as a
      principal), "explicit deny in an identity-based policy" (a Lambda
      authorizer returned Deny, possibly from its cache) or "The security
      token included in the request is invalid" (bad access key). A Lambda
      authorizer whose Allow policy names a different stage, method or path
      ARN also produces a silent 403.
    remediation:
      - "Read the message in the body and fix the matching policy: resource policy, IAM policy of the caller, or the authorizer's returned policy."
      - For Lambda authorizers, compare the Resource ARN in the returned policy with arn:aws:execute-api:<region>:<account>:<api-id>/<stage>/<METHOD>/<path> and flush the authorizer cache while testing.
      - For private APIs, allow the VPC or VPC endpoint in the resource policy and redeploy the stage.
    references:
      - https://repost.aws/knowledge-center/api-gateway-403-error-lambda-authorizer
      - https://repost.aws/knowledge-center/api-gateway-private-endpoint-connection

  - id: apigateway.gateway.signature
    title: API Gateway rejected the AWS request signature
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [403]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^(InvalidSignatureException|IncompleteSignatureException|ExpiredTokenException)'
        required: true
        weight: 2
      - type: body
        pattern: '(?i)signature|credential|token'
    root_cause: >
      The method uses AWS_IAM authorization and the Signature Version 4
      material was rejected: the signature does not match (wrong secret
      key, region or service in the credential scope, or a header included
      in SignedHeaders that a proxy or CloudFront altered), the signature
      or session token has expired (clock skew over 15 minutes), or an
      Authorization header that is not a SigV4 signature reached a path
      with no matching resource (IncompleteSignatureException).
    remediation:
      - Regenerate the signature with the correct credentials, region and service name execute-api, and check the client clock.
      - Behind CloudFront, forward the Authorization header and avoid signing headers CloudFront rewrites (Host, User-Agent).
      - If no IAM auth was intended, the path probably does not exist; see the Missing Authentication Token entry.
    references:
      - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden

  - id: apigateway.gateway.unauthorized
    title: API Gateway authorizer did not receive a valid token
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [401]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^UnauthorizedException'
        weight: 2
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
      - type: body
        pattern: '(?i)"message"\s*:\s*"unauthorized"'
    root_cause: >
      The UNAUTHORIZED gateway response is returned before the integration
      runs: the header named as the authorizer's Token Source is missing,
      the token fails the Token Validation regular expression, a request
      authorizer's identity sources are incomplete (all are required when
      caching is on), or a Cognito user pool authorizer received an expired
      token, a token from another user pool, or an ID token where an access
      token with scopes was expected.
    remediation:
      - Send the exact header the authorizer reads (Authorization by default) with an unexpired token.
      - Test the authorizer in the console with the same token; disable authorization caching while testing.
      - For Cognito, decode the token and compare iss with the user pool and token_use with the method's scopes.
    references:
      - https://repost.aws/knowledge-center/api-gateway-401-error-lambda-authorizer
      - https://repost.aws/knowledge-center/api-gateway-cognito-401-unauthorized

  - id: apigateway.gateway.throttled
    title: API Gateway throttled the request
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [429]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: body
        pattern: '(?i)too many requests|limit exceeded'
        weight: 2
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)throttl|toomanyrequests|limitexceeded'
    root_cause: >
      429 from API Gateway is either THROTTLED ("Too Many Requests"): the
      token bucket for the usage plan, method, stage or account (10,000
      requests per second with a 5,000 burst per Region by default) ran dry,
      or QUOTA_EXCEEDED ("Limit Exceeded"): the usage plan quota for the
      day, week or month is used up. Limits are applied per client, then
      per method, then per account, then per AWS Region.
    remediation:
      - Retry with exponential backoff and jitter; the SDKs do this automatically.
      - Raise the stage or usage plan throttle, or request an account level increase.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html

  - id: apigateway.gateway.request-too-large
    title: Request payload exceeds the API Gateway 10 MB limit
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [413]
        required: true
      - type: body
        pattern: '(?i)content length exceeded|request too large|request entity too large'
        weight: 2
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
    root_cause: >
      REQUEST_TOO_LARGE: the request body exceeded 10 MB (10,485,760
      bytes). The limit applies to requests and to backend responses, cannot
      be raised, and this gateway response cannot be customised.
    remediation:
      - Upload large payloads to S3 with a presigned URL and pass a reference through the API.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html

  - id: apigateway.gateway.unsupported-media-type
    title: API Gateway has no mapping for the request Content-Type
    layer: gateway_http
    category: api_gateway
    weight: 0.9
    signals:
      - type: status
        codes: [415]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
    root_cause: >
      UNSUPPORTED_MEDIA_TYPE: the integration request has passthrough
      behaviour NEVER and no mapping template for the Content-Type sent, or
      binary media handling rejected the payload.
    remediation:
      - Add a mapping template for the media type, set passthrough to WHEN_NO_MATCH, or send Content-Type application/json.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html

  - id: apigateway.gateway.bad-request
    title: API Gateway request validation failed
    layer: gateway_http
    category: api_gateway
    weight: 0.85
    signals:
      - type: status
        codes: [400]
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^BadRequestException'
        weight: 2
      - type: body
        pattern: '(?i)invalid request body|bad request'
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
    root_cause: >
      BAD_REQUEST_BODY or BAD_REQUEST_PARAMETERS: a request validator on
      the method rejected the body or the parameters against the model, or
      the query string used characters REST APIs do not accept unescaped
      (|, {, } and ;).
    remediation:
      - Read the message field; validators name the failing property.
      - URL encode reserved characters in the query string.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html

  - id: apigateway.gateway.not-found
    title: API Gateway resource not found after authorization
    layer: gateway_http
    category: api_gateway
    weight: 0.8
    signals:
      - type: status
        codes: [404]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)^NotFoundException'
        weight: 2
      - type: body
        pattern: '(?i)"message"\s*:\s*"not found"'
    root_cause: >
      RESOURCE_NOT_FOUND is returned when the request authenticated and
      authorised but the resource does not exist in the deployed stage, or
      the integration itself answered 404. Note that an unknown path on a
      REST API without authorization is reported as 403 Missing
      Authentication Token, not 404.
    remediation:
      - Confirm the resource is part of the deployment on this stage and redeploy.
      - If the integration returned 404, test the backend directly.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html

  - id: apigateway.gateway.internal-server-error
    title: API Gateway internal server error (integration or configuration)
    layer: gateway_http
    category: api_gateway
    weight: 0.9
    signals:
      - type: status
        codes: [500]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: body
        pattern: '(?i)internal server error'
        weight: 2
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)internalservererror|configuration|authorizer'
    root_cause: >
      A gateway generated 500 covers API_CONFIGURATION_ERROR (invalid
      integration endpoint, base64 decoding failure, no integration
      response template matched), AUTHORIZER_CONFIGURATION_ERROR (the
      authorizer could not be reached), AUTHORIZER_FAILURE, a Lambda
      integration the API is not permitted to invoke
      (lambda:InvokeFunction for apigateway.amazonaws.com), a Lambda proxy
      or authorizer response that is not the required JSON shape, a stage
      variable the API cannot resolve, an integration host that only has
      IPv6 (API Gateway integrations are IPv4 only), or a backend response
      over 10 MB. HTTP APIs return {"message":"Internal Server Error"} for
      the same faults.
    remediation:
      - Add $context.integrationErrorMessage, $context.error.message and $context.error.responseType to the access log format and invoke again.
      - Grant apigateway.amazonaws.com lambda:InvokeFunction for the exact API, stage and route ARN.
      - Test the method in the console; "Execution failed due to configuration error" names the fault.
    references:
      - https://repost.aws/knowledge-center/api-gateway-5xx-error
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-troubleshooting-lambda.html

  - id: apigateway.gateway.bad-gateway
    title: API Gateway could not process the integration response
    layer: gateway_http
    category: api_gateway
    weight: 0.85
    signals:
      - type: status
        codes: [502]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
        negate: true
        required: true
    root_cause: >
      502 from API Gateway means the integration answered but the response
      could not be handled as a proxy response: a Lambda proxy function
      returned something other than {statusCode, headers, body,
      isBase64Encoded} (body must be a string), the function threw or
      timed out, or its package had a permission error. Execution logs show
      "Execution failed due to configuration error" or "Lambda execution
      failed with status 200 due to customer function error".
    remediation:
      - "Read the execution log lines before \"Method completed with status: 502\"."
      - Return the proxy response shape from the function and stringify JSON bodies.
      - Check the function's own logs for exceptions and timeouts.
    references:
      - https://repost.aws/knowledge-center/malformed-502-api-gateway

  - id: apigateway.gateway.integration-timeout
    title: API Gateway integration timed out
    layer: gateway_http
    category: api_gateway
    weight: 0.95
    signals:
      - type: status
        codes: [504]
        required: true
      - type: body
        pattern: '(?i)endpoint request timed out'
        weight: 3
      - type: header
        name: x-amzn-errortype
        pattern: '(?i)timeout|integrationfailure'
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
    root_cause: >
      INTEGRATION_TIMEOUT: the Lambda, HTTP or AWS service integration did
      not respond within the integration timeout (29 seconds by default;
      raisable above 29 seconds for Regional and private REST APIs through
      a quota request, after which each integration must be updated).
      INTEGRATION_FAILURE shares the 504 code when the integration could
      not be reached at all (VPC link, security groups, DNS).
    remediation:
      - Compare $context.integrationLatency in access logs with the configured timeout; execution logs show "Execution failed due to a timeout error".
      - Reduce backend latency or move long work to asynchronous processing; raise the timeout only after a quota increase.
      - For VPC links, check target health, security groups and the ephemeral port range.
    references:
      - https://repost.aws/knowledge-center/api-gateway-504-errors

  - id: apigateway.gateway.service-unavailable
    title: Backend behind API Gateway is unavailable
    layer: gateway_http
    category: api_gateway
    weight: 0.8
    signals:
      - type: status
        codes: [503]
        required: true
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: header
        name: x-cache
        pattern: '(?i)error from cloudfront'
        negate: true
        required: true
    root_cause: >
      API Gateway relayed a 503 because the backend integration could not
      accept the request: overloaded beyond capacity, in maintenance, or
      with no healthy targets behind a VPC link.
    remediation:
      - Scale the backend and retry with exponential backoff.
      - Check the load balancer or service behind the VPC link for healthy targets.
    references:
      - https://repost.aws/knowledge-center/api-gateway-5xx-error

  - id: apigateway.tls.security-policy
    title: API Gateway security policy rejected the offered TLS version or ciphers
    layer: tls_handshake
    category: tls
    weight: 0.97
    signals:
      - type: error
        pattern: '(?i)protocol version|handshake failure|no protocols available|unsupported protocol'
        required: true
      - type: target_host
        pattern: '(?i)\.execute-api\.[a-z0-9-]+\.(vpce\.)?amazonaws\.com$'
        required: true
        weight: 2
    root_cause: >
      The handshake with an API Gateway endpoint failed before a certificate
      was received. Custom domains and private APIs default to the TLS_1_2
      policy, HTTP APIs are fixed to it, and enhanced SecurityPolicy_*
      policies can require TLS 1.3 only; a client limited to TLS 1.0 or
      1.1 or to CBC only suites is refused. API Gateway does not support
      SSLv3 at all.
    remediation:
      - Retry with --tls-version 1.2 or 1.3 and modern ECDHE AES-GCM ciphers.
      - Check the security policy on the API or custom domain and its endpoint access mode.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-custom-domain-tls-version.html
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-security-policies-list.html

  - id: apigateway.private.custom-domain-not-associated
    title: Private API custom domain not associated with the VPC endpoint
    layer: tls_handshake
    category: api_gateway
    weight: 0.75
    signals:
      - type: verify_result
        pattern: '(?i)hostname|host name|alternative|mismatch'
        required: true
      - type: chain_name
        pattern: '(?i)amazon'
        required: true
      - type: target_host
        pattern: '(?i)execute-api|vpce'
        negate: true
      - type: public_hostname
        negate: true
    root_cause: >
      The name resolved to an API Gateway VPC endpoint but the certificate
      presented does not cover the custom domain ("SSL: no alternative
      certificate subject name matches target host name"). For private
      custom domain names the VPC endpoint needs a domain name access
      association and the domain's resource policy must allow the endpoint;
      without them the endpoint answers with the execute-api certificate.
    remediation:
      - Create the domain name access association between the private custom domain and the execute-api VPC endpoint.
      - Update the custom domain's resource policy (it is provisioned with an explicit deny) to allow the VPC endpoint.
      - Check nslookup of the custom domain returns the VPC endpoint's private IPs.
    references:
      - https://repost.aws/knowledge-center/api-gateway-private-endpoint-connection
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-api-test-invoke-url.html

  - id: apigateway.info.served-by-api-gateway
    title: Endpoint is served by API Gateway
    layer: gateway_http
    category: api_gateway
    weight: 0.5
    signals:
      - type: header
        name: x-amzn-requestid
        pattern: '.+'
        required: true
      - type: header
        name: x-amz-apigw-id
        pattern: '.+'
        required: true
      - type: status
        codes: [200, 201, 202, 204, 301, 302, 304, 307, 308]
        required: true
    root_cause: >
      The response carries API Gateway's request identifiers
      (x-amzn-RequestId and x-amz-apigw-id), so the request was accepted
      by API Gateway and answered by the integration. When Via and X-Cache
      are present too, the API is edge optimised (service owned CloudFront)
      or sits behind your own distribution.
    remediation:
      - Nothing to fix; keep x-amzn-RequestId and x-amz-apigw-id when correlating with execution and access logs.
    references:
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-endpoint-types.html
