    topics:
      - id: viewer-mtls
        title: Viewer mutual TLS (client certificates at the edge)
        tags: [mtls, viewer, trust store, required, optional, passthrough, client certificate]
        text:
          - >
            Viewer mTLS makes CloudFront request a client certificate during
            the TLS handshake and validate it against an account level trust
            store (a PEM bundle of root and intermediate CAs read once from
            S3; RSA 2048/3072/4096 or ECDSA P-256/P-384; up to 25 certificates
            and 1 MB; chain depth 4). Validation happens at the edge before
            any HTTP request exists, so failures surface as TLS alerts, never
            as HTTP status codes.
          - >
            Required mode (default): no certificate or a failed validation
            aborts the handshake. Optional mode: a valid certificate is
            accepted, an invalid one is refused, and no certificate is
            allowed through with CloudFront-Viewer-Cert-Present set to 0.
            Passthrough mode: CloudFront only proves possession of the
            private key, does not validate against a trust store, forwards
            the leaf as Client-Cert and the chain as Client-Cert-Chain, and
            leaves validation to the origin; it requires zero trust stores,
            the managed CachingDisabled cache policy on every behaviour, no
            Origin Shield, no Lambda@Edge, and an origin request policy that
            allow lists Client-Cert and Client-Cert-Chain.
          - >
            Prerequisites: every cache behaviour must be HTTPS only or
            redirect HTTP to HTTPS, HTTP/3 must be disabled (viewer mTLS is
            not supported over HTTP/3), and mTLS cannot be enabled while
            creating a distribution in the console. Options:
            AdvertiseTrustStoreCaNames sends the CA names in the
            CertificateRequest so clients pick the right certificate;
            IgnoreCertificateExpiry accepts expired client certificates while
            still checking the chain and signature.
          - >
            Revocation: enable OCSP on the trust store (every certificate
            below the trust anchor must carry an AIA OCSP URL or CloudFront
            refuses the connection; responses are cached about 30 minutes;
            an unreachable responder denies by default) or check serial
            numbers in a KeyValueStore from a Connection Function.
            Connection Functions run after trust store validation, once per
            connection, and can only allow or deny.
          - >
            What dcert sees: required mode without a certificate ends in a
            "certificate required" or handshake failure alert (exit code 6);
            an untrusted certificate ends in an unknown CA alert; an expired
            one in a certificate expired alert; a rejection by a Connection
            Function or OCSP in a bad certificate or access denied alert.
            Connection logs record the reason code (ClientCertUntrusted,
            ClientCertExpired, ClientCertNotYetValid, ClientCertMissing,
            ClientCertMaxChainDepthExceeded, ClientCertMaxSizeExceeded,
            ClientCertTypeUnsupported, ClientCertInvalid,
            ClientCertIntentInvalid, ClientCertRejected, TcpError, TcpTimeout,
            ConnectionFunctionError, Internal, UnmappedConnectionError).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-authentication.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-validation-modes.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/enable-mtls-distributions.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/certificate-revocation.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/connection-logs.html
      - id: origin-mtls
        title: Origin mutual TLS (CloudFront presenting a client certificate to the origin)
        tags: [mtls, origin, acm, client certificate, 502, 503]
        text:
          - >
            With origin mTLS, CloudFront acts as the TLS client and presents
            a certificate imported into ACM in us-east-1 (only certificates
            whose Extended Key Usage includes TLS Client Authentication are
            offered). It is configured per origin, works with custom origins,
            ALB and API Gateway, and needs a Business, Premium or pay as you
            go pricing plan.
          - >
            Not supported with VPC origins, gRPC, WebSockets, Lambda@Edge
            origin request and origin response triggers, or embedded POPs.
            The origin must present a publicly trusted server certificate
            (Mozilla CA list) and must request, validate and, if wanted,
            revocation check the CloudFront certificate itself: CloudFront
            does not check its own certificate's expiry or revocation. If the
            origin never requests a certificate, CloudFront simply does not
            send one.
          - >
            Failure modes: an origin that requests a client certificate while
            origin mTLS is off gets no certificate and CloudFront drops the
            request, which viewers see as a 502 "attempted to establish a
            connection with the origin" page. When the origin repeatedly
            rejects the CloudFront certificate (expired ACM certificate,
            issuer not in the origin trust store) or is unreachable,
            CloudFront returns 503 for a while and resumes automatically once
            handshakes succeed again; certificate changes take time to
            propagate.
          - >
            How to verify with dcert: probe the origin directly. If it
            reports client certificate required (exit code 6), enable origin
            mTLS on the distribution and load the ACM certificate's issuing
            chain into the origin's trust store (ALB trust store, nginx
            ssl_client_certificate, API Gateway truststore).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-mtls-authentication.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/origin-enable-mtls-distributions.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html
      - id: viewer-tls-policies
        title: Viewer security policies, ciphers and certificates
        tags: [tls, cipher, security policy, protocol_version, handshake_failure, certificate, acm, sni]
        text:
          - >
            The distribution's security policy sets the minimum viewer TLS
            version and cipher list: SSLv3, TLSv1, TLSv1_2016, TLSv1.1_2016,
            TLSv1.2_2018, TLSv1.2_2019, TLSv1.2_2021, TLSv1.2_2025 and
            TLSv1.3_2025 (TLS 1.3 only). TLSv1.2_2021 and later drop CBC
            ciphers; TLSv1.2_2019 drops static RSA key exchange. Key exchange
            supports prime256v1, X25519, secp384r1 and, on TLS 1.3, the
            hybrid post quantum groups X25519MLKEM768 and SecP256r1MLKEM768.
            A viewer that offers no common protocol or cipher fails the
            handshake with a protocol_version or handshake_failure alert.
          - >
            Viewer certificates must be public ACM certificates in
            us-east-1 (or IAM certificates uploaded with a /cloudfront/ path),
            issued by a CA on the Mozilla list, RSA 1024 to 4096 or ECDSA
            P-256/P-384, with intermediates but not the root in the chain.
            Only one certificate per distribution; it must cover every
            alternate domain name (exact SAN or same level wildcard) or
            UpdateDistribution fails with InvalidViewerCertificate.
          - >
            Renewals and reimports propagate asynchronously and may take up
            to 24 hours, during which some edges still serve the previous
            certificate; renew at least 24 hours before NotAfter. A request
            for a host that is not an alternate domain name of any
            distribution is answered with the default *.cloudfront.net
            certificate (hostname mismatch) or a 403 "Bad Request" page.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
          - https://repost.aws/knowledge-center/acm-certificate-not-appearing-cloudfront
      - id: origin-tls
        title: TLS between CloudFront and the origin
        tags: [origin, cipher, certificate, 502, host header, sni]
        text:
          - >
            CloudFront connects to origins with TLS 1.0 to 1.2 (no TLS 1.3
            to origins) using ECDHE-ECDSA or ECDHE-RSA AES-GCM and CBC
            suites, AES-SHA, 3DES and RC4 legacy suites, curves prime256v1,
            secp384r1 and X25519, and signature schemes RSA PKCS1 and ECDSA
            with SHA-1/224/256/384/512 (no RSA-PSS). The Origin SSL
            Protocols setting restricts which versions CloudFront offers.
          - >
            The origin certificate must be issued by a Mozilla trusted CA
            (self signed and private CAs are rejected), be unexpired, be sent
            with its full intermediate chain in order, and cover either the
            Origin Domain or, when the behaviour forwards Host, the viewer's
            host name. Any of these failing makes CloudFront drop the TCP
            connection and answer 502 with X-Cache: Error from cloudfront.
          - >
            Probe the origin the way CloudFront does: dcert
            https://<viewer-host> --connect-to <origin>:443 --sni
            <forwarded-host> reproduces the SNI and hostname check the edge
            performs.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-ciphers-cloudfront-to-origin.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-https-cloudfront-to-custom-origin.html
      - id: error-caching
        title: How CloudFront caches and serves errors
        tags: [cache, error, ttl, stale, custom error page]
        text:
          - >
            Origin 404, 414, 500, 501, 502, 503 and 504 responses are cached
            for the error caching minimum TTL (10 seconds by default) or the
            origin's Cache-Control max-age/s-maxage if longer. 400, 403, 405,
            412 and 415 are cached only when the origin sends max-age or
            s-maxage. The CachingDisabled managed policy disables error
            caching altogether.
          - >
            When a cached object has expired and the origin answers 5xx or
            times out, CloudFront keeps serving the stale copy for the error
            caching minimum TTL (stale-if-error behaviour); a 4xx is passed
            to the viewer instead. Custom error pages can be configured for
            400, 403, 404, 405, 414, 416, 500, 501, 502, 503 and 504 but not
            412 or 415, and if the error page object itself is missing the
            viewer receives the status of that fetch (often 404).
          - >
            Consequence for probing: a fix at the origin may not be visible
            through the edge for up to the error TTL (five minutes for S3
            AccessDenied); invalidate the path to check immediately.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HTTPStatusCodes.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/GeneratingCustomErrorResponses.html
      - id: request-limits
        title: Request and origin limits that produce edge errors
        tags: [limits, quotas, timeout, 414, 494, 504, 413]
        text:
          - >
            Maximum request or origin response size including headers and
            query string but not body is 32,768 bytes (494 when headers push
            a request over); maximum URL length 8,192 bytes (414); maximum
            request body 64 GB; maximum cacheable object 50 GB.
          - >
            Origin connection timeout 1 to 10 seconds with 1 to 3 attempts
            (default 10 s x 3 = 30 s), origin response timeout 1 to 120
            seconds (default 30 s; GET and HEAD are retried up to the attempt
            count, other methods are not), keep alive 1 to 300 seconds,
            WebSocket idle timeout 10 minutes. Lambda@Edge functions time out
            at 30 seconds and may return 40 KB (viewer events) or 1 MB
            (origin events).
          - >
            mTLS quotas: 20 trust stores per account, 25 distributions per
            trust store, CA bundle 1 MB with up to 25 certificates of 16 KB
            each, certificate chain depth 4. At most two distributions may be
            chained in front of an origin; more returns 403.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-limits.html
      - id: signed-urls
        title: Signed URLs and signed cookies
        tags: [signed url, signed cookie, key group, 403, private content]
        text:
          - >
            A behaviour with Restrict viewer access requires a signature made
            with a key in one of the distribution's trusted key groups (or
            the legacy trusted signer's CloudFront key pair). CloudFront
            answers 403 with "Missing Key-Pair-Id query parameter or cookie
            value" when no key id is present and "Unknown Key" when the id is
            not trusted.
          - >
            Other 403 causes: the request time is past Expires,
            CloudFront-Expires or DateLessThan or before DateGreaterThan
            (epoch seconds, UTC); more than one statement in the policy; a
            Resource that is not the full URL with matching scheme and host;
            whitespace in the policy or a policy that was not hashed before
            signing; an IpAddress condition with an IPv6 viewer or an address
            outside the range; signed cookies without matching Domain and
            Path attributes.
        references:
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-signed-url-cookies
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/PrivateContent.html
      - id: s3-origins
        title: S3 origins (REST endpoint versus website endpoint)
        tags: [s3, oac, oai, access denied, kms, website endpoint]
        text:
          - >
            A REST endpoint origin (bucket.s3.region.amazonaws.com) can be
            private behind an origin access control (OAC, service principal
            cloudfront.amazonaws.com with an AWS:SourceArn condition) or a
            legacy origin access identity; only OAC can read SSE-KMS objects
            and the key policy must grant the CloudFront principal. A website
            endpoint origin (bucket.s3-website-region.amazonaws.com) is plain
            HTTP, cannot use HTTPS to the origin, and serves only public
            objects.
          - >
            AccessDenied from S3 also hides missing objects unless
            s3:ListBucket is granted, so a 403 may really be a 404: keys are
            case sensitive and the Origin Path is prepended to every request.
            Block Public Access, Requester Pays, object ownership by another
            account and organisation SCPs are the remaining causes.
        references:
          - https://repost.aws/knowledge-center/s3-rest-api-cloudfront-error-403
          - https://repost.aws/knowledge-center/s3-website-cloudfront-error-403

  # =====================================================================
  # Amazon API Gateway
  # =====================================================================
  - id: api_gateway
    name: Amazon API Gateway
    summary: >
      Managed HTTP front door for Lambda, HTTP and AWS service integrations.
      REST APIs (edge optimised behind a service owned CloudFront
      distribution, Regional, or private via an interface VPC endpoint),
      HTTP APIs and WebSocket APIs. Gateway responses are generated by API
      Gateway itself without calling the integration and carry
      x-amzn-ErrorType; integration responses carry x-amzn-Remapped-* headers.
    detect:
      headers:
        - name: x-amzn-errortype
          pattern: '.+'
        - name: x-amz-apigw-id
          pattern: '.+'
        - name: x-amzn-requestid
          pattern: '.+'
      hosts:
        - '\.execute-api\.[a-z0-9-]+\.amazonaws\.com$'
        - '\.execute-api\.[a-z0-9-]+\.vpce\.amazonaws\.com$'

    statuses:
      - code: 400
        title: Bad Request
        generated_by: edge
        summary: >
          Request validation failed (BAD_REQUEST_PARAMETERS or
          BAD_REQUEST_BODY gateway responses) or the request could not be
          parsed. REST APIs reject unescaped |, { and } in query strings
          and split on semicolons.
        causes:
          - A request validator rejected parameters or body against the model.
          - Unsupported characters in the query string.
        checks:
          - Read the message field; validators name the failing property.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - code: 401
        title: Unauthorized
        generated_by: edge
        summary: >
          UNAUTHORIZED gateway response: the request was rejected before any
          authorizer ran, or a Cognito or Lambda authorizer failed to
          authenticate the caller. The token header named as Token Source is
          missing, fails the Token Validation regex, or all identity sources
          of a request authorizer are not present. WWW-Authenticate from an
          integration is remapped to x-amzn-Remapped-WWW-Authenticate.
        causes:
          - Missing Authorization (or configured) header.
          - Token failed validation regex or expired; issuer does not match the Cognito user pool.
          - Wrong token type (ID token versus access token when scopes are configured).
        checks:
          - Send the exact header the authorizer is configured to read; retest with caching disabled.
        references:
          - https://repost.aws/knowledge-center/api-gateway-401-error-lambda-authorizer
          - https://repost.aws/knowledge-center/api-gateway-cognito-401-unauthorized
      - code: 403
        title: Forbidden
        generated_by: edge
        summary: >
          Several gateway responses share 403 and are told apart by
          x-amzn-ErrorType and the message. MissingAuthenticationTokenException
          "Missing Authentication Token" means no resource or method matches
          the path (wrong stage, path, method, or the stage repeated on a
          custom domain). ForbiddenException "Forbidden" covers a missing or
          invalid API key, an AWS WAF block, a private API reached through
          public DNS without the Host or x-apigw-api-id header, a custom
          domain without a base path mapping, a stage that does not exist,
          a client certificate the mTLS truststore does not trust, the
          default execute-api endpoint after it was disabled, or public APIs
          called from a VPC whose endpoint has private DNS enabled.
          AccessDeniedException carries the IAM or resource policy reason.
          InvalidSignatureException and IncompleteSignatureException relate
          to SigV4; EXPIRED_TOKEN is 403 as well.
        causes:
          - Path, method or stage does not exist in the deployed API.
          - Custom domain URL includes the stage that the API mapping already maps.
          - API key missing, disabled, wrong, or not attached to a usage plan for the stage (send x-api-key).
          - AWS WAF web ACL blocked the request.
          - Resource policy or IAM policy denies execute-api:Invoke (explicit or implicit deny); Lambda authorizer returned Deny or a policy whose Resource ARN does not match the invoked method.
          - Private API invoked from outside its VPC endpoint, or public API invoked from a VPC endpoint with private DNS on.
          - Mutual TLS custom domain rejected the client certificate (issuer not in truststore, insecure signature algorithm, self signed).
          - Default execute-api endpoint disabled while the request did not use the custom domain.
        checks:
          - Compare x-amzn-ErrorType with the table in `dcert kb explain x-amzn-errortype`.
          - "Enable execution and access logging; an mTLS 403 logs \"Access denied. Reason: ...\", and no log entry at all means the request never matched the API."
          - curl -v the stage URL directly to rule out the custom domain mapping.
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
          - https://repost.aws/knowledge-center/api-gateway-mutual-tls-403-errors
          - https://repost.aws/knowledge-center/api-gateway-403-error-lambda-authorizer
      - code: 404
        title: Not Found
        generated_by: either
        summary: >
          RESOURCE_NOT_FOUND gateway response when the resource cannot be
          found after authentication and authorization, or a 404 from the
          integration. An unknown path on a REST API without authorization
          is reported as 403 Missing Authentication Token rather than 404.
        causes:
          - Integration returned 404.
          - Resource missing in the deployed stage.
        checks:
          - Confirm the deployment contains the resource and redeploy the stage.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - code: 413
        title: Request Too Large
        generated_by: edge
        summary: >
          REQUEST_TOO_LARGE: the payload exceeded 10 MB ("HTTP content
          length exceeded 10485760 bytes"). The quota cannot be raised and
          this gateway response cannot be customised.
        causes:
          - Request body over 10 MB.
        checks:
          - Upload large objects to S3 with a presigned URL instead.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - code: 415
        title: Unsupported Media Type
        generated_by: edge
        summary: >
          UNSUPPORTED_MEDIA_TYPE: the Content-Type has no mapping template
          and passthrough behaviour is NEVER, or binary media type handling
          rejected the payload.
        causes:
          - Integration request passthrough set to NEVER without a template for the media type.
        checks:
          - Add a mapping template for the Content-Type or set passthrough to WHEN_NO_MATCH.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - code: 429
        title: Too Many Requests
        generated_by: edge
        summary: >
          THROTTLED ("Too Many Requests") when usage plan, method, stage or
          account throttling (10,000 requests per second, burst 5,000 per
          Region by default) is exceeded, or QUOTA_EXCEEDED ("Limit
          Exceeded") when the usage plan quota is exhausted. Throttles are
          best effort token buckets.
        causes:
          - Account, stage, method or per API key rate or burst exceeded.
          - Usage plan quota for the period exhausted.
        checks:
          - Retry with exponential backoff; raise stage or account limits.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
      - code: 500
        title: Internal Server Error
        generated_by: edge
        summary: >
          Generic "Internal server error" gateway response. It covers
          API_CONFIGURATION_ERROR (bad integration URI, base64 decoding
          failure, no matching integration response template),
          AUTHORIZER_CONFIGURATION_ERROR (cannot reach the authorizer),
          AUTHORIZER_FAILURE, a Lambda invocation the API has no permission
          for, a malformed Lambda proxy or authorizer output, a stage
          variable without permission, an IPv6 only integration host, or a
          backend response over 10 MB. HTTP APIs return
          {"message":"Internal Server Error"} for the same class of faults.
        causes:
          - lambda:InvokeFunction not granted to apigateway.amazonaws.com for this API, stage and route.
          - Lambda proxy response not in the required JSON shape or authorizer policy malformed.
          - Integration endpoint unreachable, IPv6 only, or returning more than 10 MB.
          - No integration response mapping matched the backend status.
        checks:
          - Add $context.integrationErrorMessage, $context.error.message and $context.error.responseType to the access log format.
          - Test the method in the console; "Execution failed due to configuration error" names the fault.
        references:
          - https://repost.aws/knowledge-center/api-gateway-5xx-error
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-troubleshooting-lambda.html
      - code: 502
        title: Bad Gateway
        generated_by: edge
        summary: >
          The integration returned a response API Gateway could not process
          as a proxy: a Lambda proxy function returned something other than
          {statusCode, headers, body, isBase64Encoded}, threw an error, or
          failed with a package permission error ("Execution failed due to
          configuration error", "Lambda execution failed with status 200 due
          to customer function error").
        causes:
          - Lambda proxy integration response not JSON of the required shape (body must be a string).
          - Lambda function crashed, timed out or had a permission error on its package.
        checks:
          - "Read the execution log lines before \"Method completed with status: 502\"."
        references:
          - https://repost.aws/knowledge-center/malformed-502-api-gateway
      - code: 503
        title: Service Unavailable
        generated_by: origin
        summary: >
          The backend integration did not accept the request: overloaded
          beyond capacity or in maintenance. API Gateway relays it.
        causes:
          - Backend cannot accept new connections.
        checks:
          - Scale the backend and retry with exponential backoff.
        references:
          - https://repost.aws/knowledge-center/api-gateway-5xx-error
      - code: 504
        title: Endpoint Request Timed Out
        generated_by: edge
        summary: >
          INTEGRATION_TIMEOUT ("Endpoint request timed out") when the
          integration took longer than the integration timeout (29 seconds by
          default; raisable above 29 s for Regional and private REST APIs by
          quota request), or INTEGRATION_FAILURE when API Gateway could not
          reach the integration at all. Execution logs show "Execution
          failed due to a timeout error".
        causes:
          - Lambda or HTTP backend slower than the integration timeout.
          - Integration endpoint unreachable (VPC link, security groups, DNS).
        checks:
          - Compare $context.integrationLatency with the configured timeout.
          - Move long work to asynchronous processing or raise the timeout after a quota increase.
        references:
          - https://repost.aws/knowledge-center/api-gateway-504-errors

    headers:
      - name: x-amzn-ErrorType
        direction: response
        summary: >
          Present on responses API Gateway generated itself (gateway
          responses); the integration was not called. The value names the
          reason.
        values:
          - pattern: '(?i)^MissingAuthenticationTokenException'
            meaning: No resource or method matches the request (path, method, stage, or the stage repeated on a custom domain), or the request carried no token; the API definition, not the backend, rejected it.
          - pattern: '(?i)^ForbiddenException'
            meaning: Plain "Forbidden" with many possible causes, including API key, AWS WAF, private API DNS, custom domain base path mapping, unknown stage, mTLS client certificate rejection, or a disabled default endpoint.
          - pattern: '(?i)^AccessDeniedException'
            meaning: IAM authorization, resource policy or a Lambda authorizer denied execute-api:Invoke; the message states whether the deny is explicit or implicit and which principal was evaluated.
          - pattern: '(?i)^UnauthorizedException'
            meaning: The authorizer rejected or never received the token (401).
          - pattern: '(?i)^InvalidSignatureException'
            meaning: SigV4 signature mismatch or expired signature; check the secret key, signing region and clock.
          - pattern: '(?i)^IncompleteSignatureException'
            meaning: An Authorization header that is not a complete SigV4 signature was sent to a path that does not exist.
          - pattern: '(?i)^InternalServerErrorException'
            meaning: Integration, authorizer or configuration failure (500); enable execution logs.
          - pattern: '(?i)^IntegrationTimeoutException'
            meaning: The integration did not answer within the integration timeout (504).
          - pattern: '(?i)^ThrottlingException|^TooManyRequestsException|^LimitExceededException'
            meaning: Throttled by rate, burst or usage plan quota (429).
          - pattern: '(?i)^NotFoundException'
            meaning: The resource was not found after authorization (404).
          - pattern: '(?i)^BadRequestException'
            meaning: Request validation or parsing failed (400).
          - pattern: '(?i)^RequestEntityTooLargeException'
            meaning: Payload over 10 MB (413).
          - pattern: '(?i)^UnsupportedMediaTypeException'
            meaning: No mapping template for the Content-Type with passthrough NEVER (415).
          - pattern: '(?i)^ExpiredTokenException'
            meaning: The AWS authentication token in the request has expired (403).
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - name: x-amzn-RequestId
        direction: response
        summary: >
          API Gateway request id ($context.requestId); search execution and
          access logs for it.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-mapping-template-reference.html
      - name: x-amz-apigw-id
        direction: response
        summary: >
          Extended request id ($context.extendedRequestId); AWS Support uses
          this together with x-amzn-RequestId.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-mapping-template-reference.html
      - name: x-amzn-Remapped-Connection
        direction: response
        summary: >
          Integration response headers that API Gateway does not pass through
          are renamed to x-amzn-Remapped-<name>: Authorization, Connection,
          Content-MD5, Max-Forwards, User-Agent, WWW-Authenticate are
          remapped; Date and Server are remapped and overwritten; Host,
          Expect, Proxy-Authenticate, TE, Transfer-Encoding, Trailer and
          Upgrade are dropped.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: x-amzn-Remapped-WWW-Authenticate
        direction: response
        summary: >
          The integration's WWW-Authenticate header, renamed. Old Android
          HttpURLConnection clients throw on a 401 without a real
          WWW-Authenticate.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: x-amzn-Remapped-Server
        direction: response
        summary: The integration's Server header; API Gateway overwrites the real Server header.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: x-amzn-Remapped-Date
        direction: response
        summary: The integration's Date header; API Gateway overwrites the real Date header.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: x-amzn-Trace-Id
        direction: response
        summary: AWS X-Ray trace id when tracing is enabled on the stage.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-xray.html
      - name: Content-Type
        direction: response
        summary: >
          API Gateway adds Content-Type application/json to every integration
          response that lacks one, and to requests with an empty body on
          HTTP APIs.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: x-api-key
        direction: request
        summary: >
          API key for methods that require one; missing, wrong, disabled or
          not attached to a usage plan for the stage yields 403 Forbidden.
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - name: x-apigw-api-id
        direction: request
        summary: >
          Selects the private API when invoking an endpoint specific VPC
          endpoint DNS name (alternative to setting Host to the API's
          execute-api name).
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-api-test-invoke-url.html
      - name: Forwarded
        direction: request
        summary: >
          HTTP APIs translate X-Forwarded-* into a standard Forwarded header
          and append the egress IP, Host and protocol.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - name: X-Forwarded-For
        direction: request
        summary: >
          REST APIs append the caller IP; behind CloudFront the edge server IP
          is appended after the viewer IP.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html

    bodies:
      - pattern: '(?i)missing authentication token'
        status: 403
        meaning: >
          No deployed resource and method match the request path. Check the
          stage name, the path, the HTTP method, and on a custom domain do
          not repeat the stage that the API mapping already supplies.
        references:
          - https://repost.aws/knowledge-center/api-gateway-403-custom-domain
      - pattern: '(?i)"message"\s*:\s*"forbidden"'
        status: 403
        meaning: >
          ForbiddenException. Causes: API key, AWS WAF, private API via public
          DNS, custom domain without base path mapping, unknown stage, mTLS
          client certificate rejected, default endpoint disabled, or a VPC
          endpoint with private DNS in front of a public API.
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - pattern: '(?i)not authorized to perform: execute-api:Invoke'
        status: 403
        meaning: >
          Resource policy or IAM evaluation denied the call; "with an explicit
          deny" names a Deny statement, "because no resource-based policy
          allows" is an implicit deny, and "User: anonymous" means no
          credentials or the VPC endpoint was not allowed.
        references:
          - https://repost.aws/knowledge-center/api-gateway-403-error-lambda-authorizer
      - pattern: '(?i)not authorized to access this resource with an explicit deny in an identity-based policy'
        status: 403
        meaning: A Lambda authorizer returned a Deny policy (possibly cached; flush the authorizer cache to retest).
        references:
          - https://repost.aws/knowledge-center/api-gateway-403-error-lambda-authorizer
      - pattern: '(?i)security token included in the request is invalid'
        status: 403
        meaning: The IAM access key used to sign the request is unknown or expired.
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - pattern: '(?i)signature expired|request signature we calculated does not match'
        status: 403
        meaning: "SigV4 signature problem: clock skew beyond 15 minutes, wrong secret key, region or service name in the signing scope."
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - pattern: '(?i)authorization header requires ''credential'' parameter'
        status: 403
        meaning: A non SigV4 Authorization header reached a path with no matching resource, so API Gateway tried to treat it as IAM auth.
        references:
          - https://repost.aws/knowledge-center/api-gateway-troubleshoot-403-forbidden
      - pattern: '(?i)"message"\s*:\s*"unauthorized"'
        status: 401
        meaning: The authorizer did not receive a valid token; check the token source header and validation regex.
        references:
          - https://repost.aws/knowledge-center/api-gateway-401-error-lambda-authorizer
      - pattern: '(?i)invalid api key'
        status: 403
        meaning: "INVALID_API_KEY gateway response: the x-api-key value is unknown, disabled, or not in a usage plan for this stage."
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - pattern: '(?i)"message"\s*:\s*"internal server error"'
        status: 500
        meaning: >
          Gateway generated 500: integration permission, malformed Lambda
          output, configuration error or backend over 10 MB. Enable execution
          logging to see the reason.
        references:
          - https://repost.aws/knowledge-center/api-gateway-5xx-error
      - pattern: '(?i)endpoint request timed out'
        status: 504
        meaning: "INTEGRATION_TIMEOUT: the integration exceeded the integration timeout (29 s default)."
        references:
          - https://repost.aws/knowledge-center/api-gateway-504-errors
      - pattern: '(?i)"message"\s*:\s*"too many requests"'
        status: 429
        meaning: "THROTTLED: rate or burst limit exceeded at usage plan, method, stage or account level."
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
      - pattern: '(?i)"message"\s*:\s*"limit exceeded"'
        status: 429
        meaning: "QUOTA_EXCEEDED: the usage plan quota for the period is used up."
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - pattern: '(?i)http content length exceeded 10485760 bytes'
        status: 413
        meaning: "REQUEST_TOO_LARGE: payload over the fixed 10 MB limit."
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - pattern: '(?i)"message"\s*:\s*"not found"'
        status: 404
        meaning: RESOURCE_NOT_FOUND after authorization succeeded, or an integration 404.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
      - pattern: '(?i)invalid request body|bad request body|bad request parameters'
        status: 400
        meaning: A request validator rejected the body or parameters against the configured model.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html

    errors:
      # --- apigateway REST control plane (2015-07-09) ---
      - name: BadRequestException
        http_status: 400
        summary: '(REST API control plane) The submitted request is not valid, for example, the input is incomplete or incorrect.'
      - name: ConflictException
        http_status: 409
        summary: '(REST API control plane) The request configuration has conflicts.'
      - name: LimitExceededException
        http_status: 429
        summary: '(REST API control plane) The request exceeded the rate limit.'
      - name: NotFoundException
        http_status: 404
        summary: '(REST API control plane) The requested resource is not found.'
      - name: ServiceUnavailableException
        http_status: 503
        summary: '(REST API control plane) The requested service is not available.'
      - name: TooManyRequestsException
        http_status: 429
        summary: '(REST API control plane) The request has reached its throttling limit.'
      - name: UnauthorizedException
        http_status: 401
        summary: '(REST API control plane) The request is denied because the caller has insufficient permissions.'
      # --- apigatewayv2 HTTP and WebSocket control plane (2018-11-29) ---
      - name: AccessDeniedException
        http_status: 403
        summary: '(HTTP and WebSocket API control plane) The caller is not allowed to perform the operation.'
      - name: BadRequestException.v2
        http_status: 400
        summary: '(HTTP and WebSocket API control plane) The request is not valid, for example, the input is incomplete or incorrect.'
      - name: ConflictException.v2
        http_status: 409
        summary: '(HTTP and WebSocket API control plane) The requested operation would cause a conflict with the current state of a service resource.'
      - name: NotFoundException.v2
        http_status: 404
        summary: '(HTTP and WebSocket API control plane) The resource specified in the request was not found.'
      - name: TooManyRequestsException.v2
        http_status: 429
        summary: '(HTTP and WebSocket API control plane) A limit has been exceeded.'
      # --- gateway response types (data plane), listed here so `kb explain` finds them by name ---
      - name: ACCESS_DENIED
        http_status: 403
        summary: '(gateway response) Authorization failure from a custom or Cognito authorizer.'
      - name: API_CONFIGURATION_ERROR
        http_status: 500
        summary: '(gateway response) Invalid endpoint address, base64 decode failure, or no integration response template matched.'
      - name: AUTHORIZER_CONFIGURATION_ERROR
        http_status: 500
        summary: '(gateway response) API Gateway could not connect to the custom or Cognito authorizer.'
      - name: AUTHORIZER_FAILURE
        http_status: 500
        summary: '(gateway response) The custom or Cognito authorizer failed to authenticate the caller.'
      - name: BAD_REQUEST_PARAMETERS
        http_status: 400
        summary: '(gateway response) Request parameters failed validation.'
      - name: BAD_REQUEST_BODY
        http_status: 400
        summary: '(gateway response) Request body failed validation.'
      - name: EXPIRED_TOKEN
        http_status: 403
        summary: '(gateway response) AWS authentication token expired.'
      - name: INTEGRATION_FAILURE
        http_status: 504
        summary: '(gateway response) The integration failed.'
      - name: INTEGRATION_TIMEOUT
        http_status: 504
        summary: '(gateway response) The integration timed out.'
      - name: INVALID_API_KEY
        http_status: 403
        summary: '(gateway response) Invalid API key for a method that requires one.'
      - name: INVALID_SIGNATURE
        http_status: 403
        summary: '(gateway response) Invalid AWS SigV4 signature.'
      - name: MISSING_AUTHENTICATION_TOKEN
        http_status: 403
        summary: '(gateway response) Missing authentication token, including calls to an unsupported method or resource.'
      - name: QUOTA_EXCEEDED
        http_status: 429
        summary: '(gateway response) Usage plan quota exceeded.'
      - name: REQUEST_TOO_LARGE
        http_status: 413
        summary: '(gateway response) Request too large; cannot be customised.'
      - name: RESOURCE_NOT_FOUND
        http_status: 404
        summary: '(gateway response) Resource not found after authentication and authorization.'
      - name: THROTTLED
        http_status: 429
        summary: '(gateway response) Usage plan, method, stage or account throttling limit exceeded.'
      - name: UNAUTHORIZED
        http_status: 401
        summary: '(gateway response) The custom or Cognito authorizer failed to authenticate the caller.'
      - name: UNSUPPORTED_MEDIA_TYPE
        http_status: 415
        summary: '(gateway response) Payload media type unsupported with strict passthrough.'
      - name: WAF_FILTERED
        http_status: 403
        summary: '(gateway response) Request blocked by AWS WAF.'
      - name: DEFAULT_4XX
        http_status: 400
        summary: '(gateway response) Fallback for every 4XX type; overriding its status changes all 4XX responses.'
      - name: DEFAULT_5XX
        http_status: 500
        summary: '(gateway response) Fallback for every 5XX type; overriding its status changes all 5XX responses.'

    topics:
      - id: apigateway-mtls
        title: Mutual TLS on API Gateway custom domain names
        tags: [mtls, truststore, client certificate, custom domain, 403]
        text:
          - >
            Mutual TLS is enabled per Regional custom domain name (REST APIs
            need the TLS_1_2 policy, HTTP APIs a minimum TLS 1.2; not
            available for private APIs or edge optimised domains, and not
            with enhanced SecurityPolicy_* policies). The truststore is a PEM
            bundle in S3, versioned, that must contain the complete chain
            from the issuing CA up to the root; chain length at most 4;
            SHA-256 or stronger, RSA-2048 or stronger, ECDSA-256/384;
            self signed certificates are accepted as anchors.
          - >
            API Gateway validates X.509 syntax, integrity, validity period
            and name and key chaining, but never revocation (use a Lambda
            authorizer with requestContext.identity.clientCert for CRL or
            OCSP). Unlike CloudFront it completes the handshake and then
            denies the request with HTTP 403 {"message":"Forbidden"} and
            x-amzn-ErrorType ForbiddenException; execution logs show
            "Access denied. Reason: Could not find issuer for certificate",
            "Client cert using an insecure Signature Algorithm" or "self
            signed certificate". No log entry at all means the 403 is not
            about mTLS.
          - >
            Disable the default execute-api endpoint or clients can bypass
            mTLS. Imported or Private CA server certificates need an ACM
            issued ownershipVerificationCertificate; if it expires and cannot
            auto renew, domain updates are locked
            (PENDING_OWNERSHIP_VERIFICATION); a reimported certificate whose
            SANs are not covered leaves PENDING_CERTIFICATE_REIMPORT. "The
            certificate subject <subject> conflicts with an existing
            certificate from a different issuer" means one subject may only
            have one issuer across mTLS domains. Truststore warnings ("Your
            truststore bundle has N invalid certificates") are raised only at
            update time.
          - >
            Verify with dcert: probe the custom domain with --client-cert and
            --client-key; a 403 Forbidden with ForbiddenException and no
            other cause is the truststore rejecting the chain. Check the
            chain locally with openssl verify -CAfile bundle.pem client.pem.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/rest-api-mutual-tls.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-mutual-tls.html
          - https://repost.aws/knowledge-center/api-gateway-mutual-tls-403-errors
      - id: apigateway-backend-mtls
        title: API Gateway presenting a client certificate to the backend
        tags: [mtls, backend, client certificate, integration]
        text:
          - >
            REST and WebSocket APIs can present a client certificate to HTTP
            integrations: either an API Gateway generated self signed
            certificate (valid 365 days, rotate before expiry) or your own
            ACM certificate. The backend must trust it (requestCert plus the
            PEM in its CA list) and must itself use a server certificate from
            a CA API Gateway trusts that matches the integration host name.
          - >
            NGINX and Heroku backends are documented as possibly incompatible
            with this client authentication. A backend that presents a self
            signed certificate, a missing intermediate, or an unknown CA
            makes the console test report "unknown endpoint errors" and the
            method returns 500 or 504.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/getting-started-client-side-ssl-authentication.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - id: apigateway-endpoint-types
        title: Endpoint types, custom domains and private APIs
        tags: [edge optimized, regional, private, vpc endpoint, custom domain, cloudfront, dns]
        text:
          - >
            Edge optimised REST APIs (the default) sit behind a service
            owned CloudFront distribution: responses carry Via, X-Cache and
            X-Amz-Cf-Pop, header names are capitalised and cookies sorted.
            Regional endpoints pass headers as is and are the only type that
            supports mTLS; put your own CloudFront distribution in front of a
            Regional API (origin = the execute-api host or the custom
            domain's target domain d-xxxx.execute-api.<region>.amazonaws.com,
            HTTPS only, minimum origin TLS 1.2, Origin Path = /stage, forward
            Authorization and Host where needed). Private APIs are reachable
            only through an interface VPC endpoint and need a resource policy
            that allows the VPC or endpoint.
          - >
            Custom domain names use API mappings (stage to base path); the
            stage must not be repeated in the URL or the response is 403
            Missing Authentication Token. Custom domains cannot be shared
            between REST and WebSocket APIs, and /ping and /sping are
            reserved.
          - >
            VPC endpoint DNS: with private DNS on, every
            *.execute-api.<region>.amazonaws.com name in the VPC resolves to
            the endpoint, which serves private APIs only, so public APIs
            return 403 Forbidden from inside the VPC. With private DNS off,
            private APIs must be invoked through
            <vpce-dns>.execute-api.<region>.vpce.amazonaws.com with a Host or
            x-apigw-api-id header, or <api-id>-<vpce-id>.execute-api...
            alias names. "SSL: no alternative certificate subject name
            matches target host name" on a private custom domain means the
            domain name access association with the VPC endpoint is missing.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-endpoint-types.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-api-test-invoke-url.html
          - https://repost.aws/knowledge-center/api-gateway-vpc-connections
          - https://repost.aws/knowledge-center/api-gateway-private-endpoint-connection
          - https://repost.aws/knowledge-center/api-gateway-cloudfront-distribution
      - id: apigateway-tls-policies
        title: Security policies and ciphers
        tags: [tls, cipher, security policy, protocol_version, handshake_failure]
        text:
          - >
            REST APIs and custom domains choose a security policy. Legacy
            TLS_1_0 (TLS 1.0 to 1.3, CBC and static RSA suites) and TLS_1_2
            (TLS 1.2 and 1.3). Defaults: TLS_1_0 for Regional and edge
            optimised APIs, TLS_1_2 for private APIs and every custom domain.
            Enhanced policies (SecurityPolicy_TLS13_1_3_2025_09 TLS 1.3 only,
            _FIPS_, _PFS_PQ_, _PQ_, SecurityPolicy_TLS13_1_2_2021_06, and
            the _EDGE variants) require endpoint access mode STRICT, cannot
            be combined with mTLS, and cannot front HTTP API mappings.
          - >
            HTTP and WebSocket APIs are fixed to TLS_1_2 (TLS 1.2 and 1.3
            with AES-GCM, CHACHA20 and CBC-SHA256 ECDHE suites). API Gateway
            only speaks TLS 1.2 on egress to integrations. Changing a custom
            domain's policy takes about 15 minutes (lastUpdateStatus
            PENDING). $context.tlsVersion and $context.cipherSuite in access
            logs record what clients negotiated.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-custom-domain-tls-version.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-security-policies-list.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-ciphers.html
      - id: apigateway-gateway-responses
        title: Gateway responses versus integration responses
        tags: [gateway response, x-amzn-errortype, remapped, headers, default 4xx]
        text:
          - >
            A gateway response is produced by API Gateway without invoking
            the integration and carries x-amzn-ErrorType; the default body is
            {"message":"<reason>"}. Each type (ACCESS_DENIED 403,
            API_CONFIGURATION_ERROR 500, AUTHORIZER_CONFIGURATION_ERROR 500,
            AUTHORIZER_FAILURE 500, BAD_REQUEST_PARAMETERS 400,
            BAD_REQUEST_BODY 400, EXPIRED_TOKEN 403, INTEGRATION_FAILURE 504,
            INTEGRATION_TIMEOUT 504, INVALID_API_KEY 403, INVALID_SIGNATURE
            403, MISSING_AUTHENTICATION_TOKEN 403, QUOTA_EXCEEDED 429,
            REQUEST_TOO_LARGE 413, RESOURCE_NOT_FOUND 404, THROTTLED 429,
            UNAUTHORIZED 401, UNSUPPORTED_MEDIA_TYPE 415, WAF_FILTERED 403)
            can be customised with headers and a template, except
            REQUEST_TOO_LARGE; changing DEFAULT_4XX or DEFAULT_5XX changes
            the status of every response of that class. AWS WAF custom
            responses take precedence.
          - >
            Integration responses pass most headers through but remap
            Authorization, Connection, Content-MD5, Max-Forwards, User-Agent
            and WWW-Authenticate to x-amzn-Remapped-<name>, overwrite Date and
            Server (originals remapped), and drop Host, Expect,
            Proxy-Authenticate, TE, Transfer-Encoding, Trailer and Upgrade.
            Header names and query parameters are case sensitive; the
            Authorization request header is dropped when it carries a SigV4
            signature or AWS_IAM authorization is used.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/supported-gateway-response-types.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-gatewayResponse-definition.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-known-issues.html
      - id: apigateway-limits
        title: Quotas that surface as errors
        tags: [limits, quotas, throttling, timeout, payload]
        text:
          - >
            Account throttle 10,000 requests per second with a 5,000 request
            burst bucket per Region (2,500 and 1,250 in some newer Regions);
            throttling order is per client or per method in a usage plan,
            per method on the stage, account, then AWS Regional. Payload
            limit 10 MB for requests and backend responses; integration
            timeout 29 seconds by default (raisable for Regional and private
            REST APIs); WebSocket frames 32 KB and messages 128 KB (larger
            closes the connection with code 1009); log events truncated at
            1,024 bytes; mapping templates 300 KB.
        references:
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/limits.html
          - https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
