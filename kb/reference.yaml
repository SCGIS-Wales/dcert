# dcert reference knowledge base for AWS edge services.
#
# Where kb/diagnostics.yaml answers "why did this probe fail", this file
# answers "what does this response mean". It explains the HTTP status codes,
# response headers, canonical error sentences and control plane exceptions
# of Amazon CloudFront and Amazon API Gateway, plus longer topics (viewer
# mTLS modes, origin mTLS, security policies, limits).
#
# Compiled from the AWS documentation and the AWS Knowledge Center on
# 2026-09-20; see kb/SOURCES.md for every page consulted. The exception
# lists come from the botocore service models (cloudfront 2020-05-31,
# apigateway 2015-07-09, apigatewayv2 2018-11-29).
#
# Used by `dcert kb explain <query>`, `dcert kb topics`, the context notes
# printed under a diagnosis, and the MCP `explain_edge_term` tool.
version: 1
services:
  # =====================================================================
  # Amazon CloudFront
  # =====================================================================
  - id: cloudfront
    name: Amazon CloudFront
    summary: >
      Global content delivery network. Viewers connect to an edge location
      (POP); the edge serves from cache or forwards to the origin (S3, ALB,
      API Gateway, EC2, any HTTP server). Errors can be generated at the
      edge ("The request could not be satisfied" pages, X-Cache: Error from
      cloudfront) or forwarded from the origin (X-Cache: Miss from
      cloudfront).
    detect:
      headers:
        - name: via
          pattern: '(?i)cloudfront'
        - name: server
          pattern: '(?i)^cloudfront$'
        - name: x-amz-cf-id
          pattern: '.+'
        - name: x-amz-cf-pop
          pattern: '.+'
        - name: x-cache
          pattern: '(?i)cloudfront'
      hosts:
        - '\.cloudfront\.net$'

    statuses:
      - code: 400
        title: Bad Request
        generated_by: either
        summary: >
          The viewer sent a request CloudFront or the origin could not accept.
          CloudFront itself returns 400 for malformed requests; an S3 origin
          returns it with "The authorization header is malformed" when the
          bucket was recreated in another Region; an ALB origin returns it for
          request lines over 16 KB, single headers over 16 KB or a header
          block over 64 KB.
        causes:
          - Malformed request line or headers from the client.
          - S3 origin bucket moved to a different Region (AuthorizationHeaderMalformed); re-save the origin to redeploy.
          - ALB origin header size limits exceeded, or the client closed the connection before sending the body.
        checks:
          - Look at the body sentence; an S3 XML error names the expected Region.
          - Compare the request headers dcert sent (--debug) with the origin's limits.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-400-bad-request.html
      - code: 401
        title: Unauthorized
        generated_by: origin
        summary: >
          The origin demanded credentials it never received. CloudFront strips
          the Authorization header on GET, HEAD and cached OPTIONS requests
          unless a cache policy or origin request policy forwards it.
        causes:
          - Authorization header not included in the cache policy or origin request policy.
          - Origin expects Basic or Bearer credentials on every request.
        checks:
          - Add Authorization to the cache key (cache policy) or use the Managed-AllViewer origin request policy.
          - If Authorization is forwarded without being in the cache key, disable caching for that behaviour or unauthenticated viewers may receive cached responses.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-401-unauthorized.html
      - code: 403
        title: Forbidden
        generated_by: either
        summary: >
          The most overloaded CloudFront status. The edge returns 403 for an
          alternate domain name that is not on the distribution ("Bad
          Request" page), an HTTP request to an HTTPS only behaviour, an HTTP
          method the behaviour does not allow, a geo restriction, an AWS WAF
          block ("Request Blocked"), a missing or invalid signed URL or
          cookie, a GET with a body, or a chain of distributions. An origin
          returns 403 for S3 access denied, an API Gateway rejection or an
          origin firewall.
        causes:
          - Host header not an alternate domain name (CNAME) of the distribution.
          - Viewer protocol policy is HTTPS only and the request was HTTP.
          - HTTP method not in the behaviour's allowed methods (GET/HEAD, +OPTIONS, or all).
          - Geographic restriction denies the viewer country (proxy egress country when probing through a proxy).
          - AWS WAF web ACL blocked the request.
          - Signed URL or cookie missing, expired, signed with an unknown key or malformed.
          - S3 origin AccessDenied (missing object, no OAC/OAI grant, SSE-KMS without key grant, Block Public Access).
          - API Gateway origin returned Forbidden or Missing Authentication Token.
          - Two or more distributions chained in front of the origin.
        checks:
          - X-Cache says Error from cloudfront for edge generated pages and Miss from cloudfront for origin errors.
          - Read the body sentence; CloudFront error pages state the reason.
          - Probe the origin directly with --connect-to to separate edge from origin failures.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-403-permission-denied.html
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-403-invalid-method.html
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-403-errors
      - code: 404
        title: Not Found
        generated_by: origin
        summary: >
          The origin has no object at the requested path, or a custom error
          page mapped another status to 404, or the custom error page object
          itself was deleted. An incorrect Origin Path is appended to every
          request and produces 404s for whole distributions.
        causes:
          - Object missing or URL wrong (S3 keys are case sensitive).
          - Origin Path setting prepends a directory that does not exist.
          - Custom error page translating another status to 404, or the error page object was removed.
        checks:
          - Request the origin directly with the same path.
          - Check the Origin Path on the origin configuration.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-404-not-found.html
      - code: 412
        title: Precondition Failed
        generated_by: either
        summary: >
          A conditional request (If-Unmodified-Since or If-None-Match) on a
          method other than GET or HEAD was not satisfied, or an
          UpdateDistribution call carried a stale If-Match ETag. CloudFront
          cannot serve custom error pages for 412.
        causes:
          - Conditional upload or modification whose precondition failed.
          - Control plane update with an outdated ETag.
        checks:
          - Fetch the current ETag with get-distribution-config before updating.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-412-precondition-failed.html
      - code: 414
        title: URI Too Long
        generated_by: edge
        summary: >
          The URL CloudFront constructed from the request exceeds 8,192
          bytes. CloudFront returns 414 and closes the TCP connection.
        causes:
          - Very long path or query string.
        checks:
          - Shorten the URL; the whole request including headers is capped at 32,768 bytes.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - code: 421
        title: Misdirected Request
        generated_by: edge
        summary: >
          An HTTP/2 connection was reused for a hostname that the negotiated
          certificate does not cover, typically when a CloudFront alternate
          domain name and an API Gateway custom domain share a host but the
          client coalesced connections.
        causes:
          - Connection coalescing across hostnames served by different certificates.
          - Alternate domain name and origin custom domain mismatch.
        checks:
          - Retry with a fresh connection or disable HTTP/2 coalescing in the client.
        references:
          - https://repost.aws/knowledge-center/api-gateway-cloudfront-distribution
      - code: 494
        title: Request Header Too Large
        generated_by: edge
        summary: >
          The request exceeded 32,768 bytes because of its headers.
          CloudFront returns the non standard 494 code and terminates the
          TCP connection.
        causes:
          - Oversized cookies or custom headers (a large Authorization token, many cookies).
        checks:
          - Trim cookies for the distribution's domain and shorten tokens.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - code: 500
        title: Internal Server Error
        generated_by: origin
        summary: >
          Almost always forwarded from the origin (S3, API Gateway, ALB or an
          application). Rarely a CloudFront POP internal error, in which case
          AWS Support needs the X-Amz-Cf-Id value.
        causes:
          - Origin application error.
          - API Gateway integration or authorizer failure.
          - CloudFront internal error (rare).
        checks:
          - X-Cache Miss from cloudfront means the origin produced it; probe the origin directly.
          - Keep the X-Amz-Cf-Id for a support case.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-500-internal-server-error.html
      - code: 502
        title: Bad Gateway
        generated_by: edge
        summary: >
          CloudFront could not obtain a usable response from the origin. The
          body sentence distinguishes DNS failure (NonS3OriginDnsError), a
          failed TLS negotiation (certificate name, expiry, self signed,
          missing intermediate, no common cipher, origin demanding a client
          certificate), a closed port, a Lambda@Edge response that failed
          validation, or a CloudFront Function that changed a read only
          header. X-Cache is Error from cloudfront.
        causes:
          - Origin domain does not resolve in public DNS.
          - Origin certificate does not cover the Origin Domain or forwarded Host header.
          - Origin certificate expired, self signed, not from a Mozilla trusted CA, or chain missing an intermediate or in the wrong order.
          - Origin supports no protocol or cipher in common with CloudFront (TLS 1.2 max to origin, ECDHE RSA or ECDSA ciphers).
          - Origin requests a client certificate but origin mTLS is not enabled on the distribution.
          - Origin closed the connection or does not listen on the configured HTTP/HTTPS ports.
          - Lambda@Edge returned an invalid response; CloudFront Function modified a read only header.
          - ALB or API Gateway origin returned its own 502.
        checks:
          - Probe the origin directly with dcert using --connect-to and the forwarded Host header as SNI.
          - Run dig or nslookup on the origin domain from the public internet.
          - Check the origin's cipher and protocol list against the CloudFront to origin table.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html
          - https://repost.aws/knowledge-center/cloudfront-502-errors
      - code: 503
        title: Service Unavailable
        generated_by: either
        summary: >
          Either the origin is out of capacity (S3 Slow Down, ALB with no
          healthy targets, API Gateway backend overloaded), or CloudFront
          itself could not satisfy the request: edge capacity exceeded
          during load tests, a Lambda@Edge or CloudFront Function execution
          error, a Lambda@Edge quota, or the origin mTLS circuit breaker when
          CloudFront repeatedly fails to complete the mTLS handshake with an
          origin.
        causes:
          - Origin overloaded or in maintenance.
          - Lambda@Edge or CloudFront Function threw an unhandled exception.
          - Lambda@Edge concurrency or invocation quota exceeded in the Region.
          - Origin mTLS handshakes repeatedly failing (expired ACM client certificate, origin unreachable); CloudFront pauses traffic and resumes automatically.
          - CloudFront capacity exceeded at the edge (load testing from a single resolver).
        checks:
          - Check the ACM client certificate attached to the origin has not expired and that the origin trusts its issuer.
          - Review Lambda@Edge logs in the Region that served the request.
          - Errors are cached for the error caching minimum TTL (10 s); a custom error response with TTL 0 disables that.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html
          - https://repost.aws/knowledge-center/cloudfront-503-error
      - code: 504
        title: Gateway Timeout
        generated_by: either
        summary: >
          Two flavours. "Gateway time-out" is the origin's own 504 forwarded
          by the edge. "The request could not be satisfied" is CloudFront
          giving up: no TCP connection within the connection timeout (10 s,
          up to 3 attempts) or no response within the origin response
          timeout (30 s default, 1 to 120 s).
        causes:
          - Origin firewall or security group blocks the CloudFront IP ranges (use the managed prefix list).
          - Origin not reachable from the public internet (internal load balancer, private subnet).
          - Slow application; time to first byte over the response timeout.
          - API Gateway integration exceeded its own timeout (29 s default).
        checks:
          - Measure the origin directly with curl -w '%{time_starttransfer}'.
          - Raise the origin response timeout only after fixing origin latency.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-504-gateway-timeout.html
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-504-errors

    headers:
      # --- response headers viewers see ---
      - name: X-Cache
        direction: response
        summary: >
          Whether the response came from the edge cache, the origin, or was
          an error generated by CloudFront.
        values:
          - pattern: '(?i)^hit from cloudfront'
            meaning: Served from the edge cache; the origin was not contacted.
          - pattern: '(?i)^miss from cloudfront'
            meaning: Fetched from the origin for this request; an error status here was produced by the origin, not the edge.
          - pattern: '(?i)^refreshhit from cloudfront'
            meaning: Cached object was revalidated with the origin (304) and served.
          - pattern: '(?i)^error from cloudfront'
            meaning: CloudFront generated the error itself (edge error page, origin unreachable, Lambda@Edge validation failure); the origin did not produce this status.
          - pattern: '(?i)^lambdageneratedresponse from cloudfront'
            meaning: A Lambda@Edge function generated the response without contacting the origin.
          - pattern: '(?i)^functiongeneratedresponse from cloudfront'
            meaning: A CloudFront Function generated the response without contacting the origin.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-response-errors.html
      - name: Via
        direction: response
        summary: >
          Set by CloudFront to "<http-version> <id>.cloudfront.net (CloudFront)";
          its presence proves the response traversed a CloudFront edge.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - name: X-Amz-Cf-Pop
        direction: response
        summary: >
          The edge location (point of presence) that served the request, as an
          airport style code plus a suffix, e.g. LHR62-P1.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-distributions.html
      - name: X-Amz-Cf-Id
        direction: both
        summary: >
          Encrypted request identifier CloudFront adds to every origin request
          and echoes to the viewer. AWS Support and CloudFront logs correlate
          on this value; keep it when raising a case.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-distributions.html
      - name: Server
        direction: response
        summary: >
          "CloudFront" on edge generated pages. On forwarded responses it is
          whatever the origin sent (AmazonS3, awselb, nginx), which tells you
          who produced the status.
        values:
          - pattern: '(?i)^cloudfront$'
            meaning: The page was generated by the edge, not the origin.
          - pattern: '(?i)^amazons3$'
            meaning: An S3 origin produced the response.
          - pattern: '(?i)awselb'
            meaning: An Elastic Load Balancing origin produced the response.
        references:
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-403-errors
      - name: Transfer-Encoding
        direction: response
        summary: >
          CloudFront only supports chunked; any Transfer-Encoding from the
          origin is rewritten to chunked. Range requests against chunked
          origin responses return the whole object.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - name: Vary
        direction: response
        summary: >
          CloudFront keeps Accept-Encoding, Cookie, User-Agent (when device
          headers are forwarded) and headers it forwards; other values are
          removed. Vary:* with a minimum TTL of 0 forces a revalidation on
          every request.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - name: Cache-Control
        direction: response
        summary: >
          Governs how long the edge caches the object and, for 400, 403, 405,
          412 and 415 responses, whether the error is cached at all (only
          with max-age or s-maxage).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/HTTPStatusCodes.html
      - name: Age
        direction: response
        summary: Seconds the object has been in the edge cache.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/ConfiguringCaching.html
      - name: X-Amz-Request-Id
        direction: response
        summary: >
          S3 request id. CloudFront normally strips X-Amz-Request-Id and
          X-Amz-Id-2 from S3 origin responses; seeing it means S3 was reached
          without CloudFront in front.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorS3Origin.html
      # --- headers CloudFront adds to origin requests ---
      - name: X-Forwarded-For
        direction: request
        summary: >
          CloudFront appends the viewer IP from the TCP connection; load
          balancers and API Gateway then append the edge server IP.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - name: User-Agent
        direction: request
        summary: >
          Replaced with "Amazon CloudFront" unless the behaviour forwards
          User-Agent; origins that fingerprint browsers see CloudFront instead.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/RequestAndResponseBehaviorCustomOrigin.html
      - name: Authorization
        direction: request
        summary: >
          Removed on GET, HEAD and cached OPTIONS unless a cache policy or
          origin request policy forwards it; kept on DELETE, PATCH, POST and
          PUT. Missing Authorization at the origin is the usual cause of 401.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-401-unauthorized.html
      - name: Host
        direction: request
        summary: >
          Set to the Origin Domain unless the policy forwards the viewer Host.
          When forwarded, the origin certificate must cover the viewer host
          name or the origin TLS handshake fails with a 502.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html
      - name: CloudFront-Forwarded-Proto
        direction: request
        summary: The protocol of the viewer request, http or https.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-Http-Version
        direction: request
        summary: The HTTP version the viewer used (1.1, 2.0, 3.0).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-TLS
        direction: request
        summary: >
          "version:cipher:handshake" for the viewer connection, e.g.
          TLSv1.3:TLS_AES_128_GCM_SHA256:sessionResumed; the last field is
          fullHandshake, sessionResumed or connectionReused. Origin request
          policies only, not cache policies.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-JA3-Fingerprint
        direction: request
        summary: JA3 fingerprint of the viewer's TLS Client Hello (HTTPS only).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-JA4-Fingerprint
        direction: request
        summary: JA4 fingerprint of the viewer's TLS Client Hello (HTTPS only).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-Address
        direction: request
        summary: Viewer IP and source port, e.g. 198.51.100.10:46532 (origin request policy only).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-ASN
        direction: request
        summary: Autonomous system number of the viewer (origin request policy only).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-Country
        direction: request
        summary: >
          ISO 3166-1 alpha-2 country of the viewer; siblings are
          CloudFront-Viewer-Country-Name, -Country-Region, -Country-Region-Name,
          -City, -Postal-Code, -Metro-Code (US only), -Latitude, -Longitude
          and -Time-Zone.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Is-Mobile-Viewer
        direction: request
        summary: >
          Device type flags derived from User-Agent; siblings are
          CloudFront-Is-Android-Viewer, -Desktop-, -IOS-, -SmartTV- and
          -Tablet-Viewer. More than one may be true.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Viewer-Header-Order
        direction: request
        summary: >
          Colon separated list of the viewer's header names in the order
          sent (truncated at 7,680 characters); CloudFront-Viewer-Header-Count
          carries the total.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      - name: CloudFront-Error-Uri
        direction: request
        summary: >
          Original request URI when CloudFront fetches a custom error page;
          CloudFront-Error-Args carries the original query string.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/adding-cloudfront-headers.html
      # --- viewer mTLS headers ---
      - name: CloudFront-Viewer-Cert-Present
        direction: request
        summary: >
          1 when the viewer presented a client certificate, 0 otherwise
          (always 1 in required mode). Available in required, optional and
          passthrough viewer mTLS modes and usable in cache policies.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Subject
        direction: request
        summary: RFC 2253 subject DN of the viewer's client certificate.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Issuer
        direction: request
        summary: RFC 2253 issuer DN of the viewer's client certificate.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Serial-Number
        direction: request
        summary: Hexadecimal, colon separated serial number of the client certificate.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Sha256
        direction: request
        summary: SHA-256 fingerprint of the client certificate, lower case hex.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Validity
        direction: request
        summary: >
          "NotBefore=<ISO8601>;NotAfter=<ISO8601>" of the client certificate.
          Origin requests only; must be allow listed in the origin request policy.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: CloudFront-Viewer-Cert-Pem
        direction: request
        summary: >
          URL encoded PEM of the leaf client certificate (required and
          optional modes). Too large for edge functions; forwarded to the
          origin only.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/viewer-mtls-headers.html
      - name: Client-Cert
        direction: request
        summary: >
          Passthrough mode only: the leaf client certificate, base64 encoded
          as an HTTP structured field byte sequence (:MII...:). Any Client-Cert
          header sent by the viewer is dropped before CloudFront adds its own.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-validation-modes.html
      - name: Client-Cert-Chain
        direction: request
        summary: >
          Passthrough mode only: the non leaf chain as a structured field
          list (may repeat; omitted for a single certificate; maximum depth 4).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/mtls-validation-modes.html

    bodies:
      - pattern: "(?i)wasn't able to resolve the origin domain name"
        status: 502
        meaning: >
          NonS3OriginDnsError. The origin domain does not resolve in public
          DNS. CloudFront resolves origins from the public internet even when
          the origin itself is private; check the zone's NS and SOA records
          and any delegated subdomain.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html
      - pattern: '(?i)attempted to establish a connection with the origin, but either the attempt failed or the origin closed the connection'
        status: 502
        meaning: >
          The TCP or TLS connection to the origin failed: certificate name,
          expiry, self signed or incomplete chain, no common cipher, a closed
          port, an origin demanding a client certificate without origin mTLS,
          or an origin that closed the connection.
        references:
          - https://repost.aws/knowledge-center/resolve-cloudfront-connection-error
      - pattern: "(?i)wasn't able to connect to the origin"
        status: 502
        meaning: >
          Same family as the failed connection sentence; TLS negotiation,
          port, firewall or DNS problem between the edge and the origin.
        references:
          - https://repost.aws/knowledge-center/resolve-cloudfront-connection-error
      - pattern: '(?i)request could not be satisfied\.?\s*bad request'
        status: 403
        meaning: >
          Edge generated 403 "Bad Request": the Host header is not an
          alternate domain name of any distribution, or an HTTP request hit
          an HTTPS only behaviour.
        references:
          - https://repost.aws/knowledge-center/resolve-cloudfront-bad-request-error
      - pattern: '(?i)request blocked'
        status: 403
        meaning: >
          AWS WAF blocked the request under the web ACL attached to the
          distribution.
        references:
          - https://repost.aws/knowledge-center/cloudfront-error-request-blocked
      - pattern: '(?i)request could not be satisfied\.?\s*the amazon cloudfront distribution is configured to block access from your country'
        status: 403
        meaning: Geographic restriction on the distribution denies the viewer's country.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
      - pattern: '(?i)missing key-pair-id'
        status: 403
        meaning: >
          The behaviour requires a signed URL or signed cookie and the request
          carried no Key-Pair-Id (or CloudFront-Key-Pair-Id cookie).
        references:
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-signed-url-cookies
      - pattern: '(?i)unknown key'
        status: 403
        meaning: >
          The Key-Pair-Id of the signed URL or cookie is not in any trusted key
          group (or the trusted signer's access key) on the distribution.
        references:
          - https://repost.aws/knowledge-center/cloudfront-troubleshoot-signed-url-cookies
      - pattern: '(?i)the lambda function associated with the cloudfront distribution is invalid or doesn'
        status: 502
        meaning: >
          Lambda@Edge validation error: the function returned a malformed
          response (not a JSON object, missing fields, read only header
          changed, body over 1 MB for origin events or 40 KB for viewer events).
        references:
          - https://repost.aws/knowledge-center/lambda-edge-500-errors
      - pattern: '(?i)cloudfront function associated with the cloudfront distribution is invalid'
        status: 502
        meaning: >
          A CloudFront Function tried to add, delete or change a read only
          header; this only shows after deployment, not in the test console.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-502-bad-gateway.html
      - pattern: '(?i)capacity exceeded'
        status: 503
        meaning: >
          CloudFront could not route the request to another edge location;
          common when load testing a single resolver's IP set.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/load-testing.html
      - pattern: '(?i)generated by cloudfront'
        meaning: >
          Footer of every CloudFront error page; the "Request ID" that follows
          it is the X-Amz-Cf-Id value for the request.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/troubleshooting-response-errors.html
      - pattern: '<Code>AccessDenied</Code>'
        status: 403
        meaning: >
          S3 error XML forwarded by the edge. Causes: object missing (S3 hides
          404 behind AccessDenied when s3:ListBucket is not granted), no OAC
          or OAI grant in the bucket policy, SSE-KMS object without a key
          grant to cloudfront.amazonaws.com, Block Public Access, or an
          explicit deny. CloudFront caches this for up to five minutes.
        references:
          - https://repost.aws/knowledge-center/s3-rest-api-cloudfront-error-403
      - pattern: '<Code>NoSuchKey</Code>'
        status: 404
        meaning: The S3 origin has no object with that key (keys are case sensitive; check the Origin Path).
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-404-not-found.html
      - pattern: '<Code>NoSuchBucket</Code>'
        status: 404
        meaning: The origin bucket does not exist in the Region the origin domain implies.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-404-not-found.html
      - pattern: '(?i)the authorization header is malformed; the region'
        status: 400
        meaning: >
          The S3 bucket behind the origin was recreated in another Region;
          re-save the origin in the CloudFront console so it is redeployed
          against the new Region.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-400-bad-request.html
      - pattern: '<Code>SlowDown</Code>'
        status: 503
        meaning: >
          S3 request rate limit per prefix (3,500 writes or 5,500 reads per
          second); spread keys across prefixes.
        references:
          - https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/http-503-service-unavailable.html

