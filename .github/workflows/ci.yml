name: CI/CD Pipeline

# Least privilege by default. Only the jobs that publish escalate, and they do
# so in their own `permissions:` block, so a pull request build never holds a
# token that can push a package or mint an OIDC identity.
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# A newer push to the same branch supersedes an in-flight run, so a busy
# branch does not queue behind its own older builds. Runs on main are never
# cancelled: they carry the release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [ stable ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      # No --all-features: that silently enables `vendored`, so the system
      # OpenSSL 3.0 code path the Linux release links against was never
      # tested. The vendored build has its own job below.
      - name: Cargo clippy (CLI, default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo clippy (MCP server, --features mcp)
        run: cargo clippy --all-targets --features mcp -- -D warnings

      - name: Cargo clippy (CLI, no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Cargo test (CLI, default features)
        run: cargo test --verbose

      - name: Cargo test (MCP server, --features mcp)
        run: cargo test --verbose --features mcp

      - name: Cargo test (CLI, no default features)
        run: cargo test --verbose --no-default-features --lib

  # Minimum supported Rust version from Cargo.toml (`rust-version`). The
  # toolchain file pins the release toolchain, so the MSRV is selected with
  # `cargo +1.91` explicitly.
  msrv:
    name: MSRV (Rust 1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.91"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Cargo check on the MSRV (CLI)
        run: cargo +1.91 check --all-targets --locked

      - name: Cargo check on the MSRV (MCP server)
        run: cargo +1.91 check --all-targets --locked --features mcp

  # The Linux release binary is built on ubuntu 22.04 (OpenSSL 3.0 headers)
  # and the Docker image runs it on debian trixie (OpenSSL 3.5). This job
  # reproduces that pairing against a loopback ML-KEM server and asserts the
  # negotiated group is named.
  # The binary resolves SSL_get0_group_name at run time (plan PR 2.6), so
  # this pairing must name the group; the job is required.
  pq-shipped-binary:
    name: Shipped binary on OpenSSL 3.5 (debian trixie)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # Only the registry is cached: a restored target/ once handed this job a
      # binary that did not contain the commit under test.
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-22.04-pq-shipped-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-pq-shipped-registry-

      - name: Build the release binary as build-linux does
        run: cargo build --release --bin dcert

      - name: Probe a loopback ML-KEM server inside debian:trixie
        run: |
          docker run --rm \
            -v "$PWD/target/release/dcert:/usr/local/bin/dcert:ro" \
            -v "$PWD/scripts/ci/pq_shipped_binary.sh:/pq_shipped_binary.sh:ro" \
            debian:trixie bash /pq_shipped_binary.sh

  # The hosted Ubuntu runners still link OpenSSL 3.0, which cannot negotiate
  # ML-KEM. This job builds with the `vendored` feature (OpenSSL 3.6 from
  # openssl-src) so the RFC 10024 hybrid key exchange, the --pq-probe path and
  # the group reporting are exercised on every run, not only on hosts that
  # happen to have a new enough libssl.
  test-post-quantum:
    name: Test (vendored OpenSSL, post quantum)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vendored-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-vendored-

      - name: Build with vendored OpenSSL
        run: cargo build --features vendored,mcp --bins

      - name: Show linked OpenSSL and post quantum capability
        run: |
          ./target/debug/dcert --version
          ./target/debug/dcert --version | grep -q "post quantum key exchange: available"

      - name: Test with vendored OpenSSL
        run: cargo test --features vendored,mcp

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-audit-

      # Prebuilt binaries rather than `cargo install`, which rebuilt each
      # tool from source on every run.
      - name: Install audit tooling
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check

      # Budget for the dcert CLI tree (security plan, objective O3).
      # scripts/cli_deps_budget.yaml decides whether a violation fails the job.
      - name: CLI dependency budget
        run: |
          pip install click pyyaml
          python scripts/check_cli_deps.py

      - name: Advisory exceptions are dated and not expired
        run: python scripts/check_exceptions.py

      # One SBOM per binary, each from its own feature set, so the CLI SBOM
      # lists no MCP crate. `--describe binaries` writes both binaries for any
      # feature set; keep the matching one from each run.
      - name: Generate SBOMs
        run: |
          mkdir -p sbom
          cargo cyclonedx --format json --describe binaries
          mv dcert_bin.cdx.json sbom/dcert-cli-sbom.cdx.json
          rm -f dcert-mcp_bin.cdx.json
          cargo cyclonedx --format json --describe binaries --features mcp
          mv dcert-mcp_bin.cdx.json sbom/dcert-mcp-sbom.cdx.json
          rm -f dcert_bin.cdx.json
          ls -l sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  # Lints every workflow, including the online check for actions with
  # published advisories. Findings below "low" (informational notes) do not fail.
  workflow-lint:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install zizmor==1.32.0
          zizmor --min-severity low --gh-token "$GH_TOKEN" .github/workflows/

  # New or changed dependencies in a pull request are checked against the
  # advisory database before they merge.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # Lint, type and consistency checks for the build scripts and the dcert-mcp
  # requirements. The package's own lint and tests are in python-mcp below.
  python-lint:
    name: Python scripts lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/dcert-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The dev extra pins ruff and mypy, so CI and a developer's machine run
      # the same versions.
      - name: Install the requirements of the extras
        run: |
          python ../../scripts/ci/extras_requirements.py proxy otel dev > extras.txt
          pip install -r extras.txt

      - name: Ruff check
        run: ruff check ../../scripts

      - name: Ruff format check
        run: ruff format --check ../../scripts

      - name: Mypy (build scripts)
        run: mypy --strict ../../scripts/build_wheels.py ../../scripts/sync_defaults.py ../../scripts/gen_cipher_table.py ../../scripts/fetch_aws_tls_policies.py ../../scripts/check_cli_deps.py ../../scripts/check_openssl_floor.py ../../scripts/check_exceptions.py ../../scripts/ci/openssl_pin.py ../../scripts/ci/extras_requirements.py ../../scripts/ci/openssl_upstream.py ../../scripts/ci/release_paths.py

      - name: Defaults in step with src/limits.rs
        run: python ../../scripts/sync_defaults.py --check

      # Known vulnerabilities in the requirements of the extras at the oldest
      # and newest versions the declared ranges allow. The package itself is
      # not on PyPI at this version until the release publishes it.
      - name: Dependency audit
        run: |
          pip install uv==0.13.9 pip-audit
          python ../../scripts/ci/extras_requirements.py proxy otel > runtime.in
          uv pip compile runtime.in --python-version 3.12 -o latest.txt
          uv pip compile runtime.in --python-version 3.12 --resolution lowest-direct -o lowest.txt
          pip-audit -r latest.txt --no-deps --disable-pip --strict
          pip-audit -r lowest.txt --no-deps --disable-pip --strict

  # The dcert-mcp package (python/dcert-mcp). It depends on `dcert` at the same
  # version, which is not on PyPI until the release publishes it, so the package
  # is installed without dependencies and the requirements of its extras are
  # installed explicitly.
  python-mcp:
    name: dcert-mcp lint and test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python/dcert-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and the requirements of its extras
        run: |
          python ../../scripts/ci/extras_requirements.py proxy otel dev > extras.txt
          pip install -r extras.txt

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Run tests with coverage
        run: pytest -v

  wheel-builder-test:
    name: Wheel builder test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml click

      - name: Run wheel builder tests
        run: >-
          pytest -v scripts/test_build_wheels.py scripts/test_sync_defaults.py
          scripts/test_gen_cipher_table.py scripts/test_fetch_aws_tls_policies.py
          scripts/test_check_cli_deps.py scripts/test_check_openssl_floor.py scripts/test_check_exceptions.py scripts/test_openssl_pin.py
          scripts/test_dcert_wheel.py scripts/test_dcert_mcp_wheel.py scripts/test_extras_requirements.py scripts/test_openssl_upstream.py
          scripts/test_release_paths.py

  # src/ciphers_table.rs is generated from the vendored IANA registry. The
  # table must regenerate byte for byte; a newer registry on iana.org is
  # reported (with a copy in the log) but does not block unrelated changes.
  cipher-table:
    name: Cipher table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install pyyaml click

      - name: Vendored IANA registry matches iana.org
        continue-on-error: true
        run: |
          python scripts/gen_cipher_table.py fetch --check --print-copy \
            || { echo "::warning::scripts/data/tls-parameters-4.csv is behind iana.org; run gen_cipher_table.py fetch and generate"; exit 1; }

      - name: Table regenerates from the vendored registry
        run: python scripts/gen_cipher_table.py generate --check

  # kb/tls_policies.yaml is generated from a snapshot of the AWS and Mozilla
  # pages that publish each policy. A change on those pages is reported
  # (with the live snapshot in the log) but does not block unrelated changes.
  tls-policy-catalogue:
    name: TLS policy catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install pyyaml click

      - name: Snapshot matches the published sources
        continue-on-error: true
        run: |
          python scripts/fetch_aws_tls_policies.py download --check --print-copy \
            || { echo "::warning::scripts/data/tls_policy_sources.json is behind the AWS or Mozilla pages; run fetch_aws_tls_policies.py download"; exit 1; }

      - name: Catalogue regenerates from the snapshot
        run: python scripts/fetch_aws_tls_policies.py generate --check

  # Integration tests: build the Rust binary and run Python integration tests
  # against the real dcert-mcp binary
  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python/dcert-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-integration-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      # dcert-mcp needs the `mcp` feature; the dcert CLI it spawns is built
      # without it, as in the release build.
      - name: Build dcert and dcert-mcp
        run: |
          cargo build --release --locked --bin dcert
          cargo build --release --locked --bin dcert-mcp --features mcp
        working-directory: ${{ github.workspace }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: |
          python ../../scripts/ci/extras_requirements.py proxy otel dev > extras.txt
          pip install -r extras.txt

      # --no-cov: the coverage gate in pyproject addopts is written for the
      # unit suite. These tests drive the real binary end to end and touch a
      # deliberately narrow slice of the package, so measuring them against an
      # 85% package-wide floor fails a job in which every test passed.
      - name: Run integration tests
        env:
          DCERT_MCP_BINARY: ${{ github.workspace }}/target/release/dcert-mcp
        run: pytest -v tests/test_integration.py --no-cov

  # Auto-tag on merge to main: determines the next semver patch version,
  # updates Cargo.toml, commits, creates a git tag, and pushes.
  # Outputs the tag/version so downstream jobs in THIS run can use them
  # (we do NOT rely on a tag push triggering a second workflow run).
  auto-tag:
    name: Auto-tag release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ test, test-post-quantum, security-audit, msrv, cipher-table, tls-policy-catalogue ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create_tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Documentation-only pushes and commits titled with [skip release] do
      # not cut a release (scripts/release_paths.yaml). Anything the script
      # cannot classify releases.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Compared with the newest release tag, not the previous push: runs on
      # main queue, and a newer push cancels a pending one, so a code change
      # whose run was cancelled still releases with the next push.
      - name: Decide whether this push releases
        id: release
        env:
          AFTER: ${{ github.sha }}
          TITLE: ${{ github.event.head_commit.message }}
        run: |
          pip install --quiet pyyaml click
          SINCE=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          python scripts/ci/release_paths.py --before "$SINCE" --after "$AFTER" --title "$TITLE"

      - name: Determine next version
        id: version
        run: |
          # Get the latest semver tag
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT="0.1.0"
          else
            # Strip 'v' prefix and split
            CURRENT="${LATEST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEXT} (tag: v${NEXT})"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Cargo.toml version and create tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false' && steps.release.outputs.release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

          # Keep Cargo.lock in step with the manifest. Without this the lock
          # file keeps the previous version, so a fresh checkout of main goes
          # dirty as soon as any cargo command runs. Rewritten in place rather
          # than through cargo, because this job installs no Rust toolchain.
          python3 - "$VERSION" <<'PYEOF'
          import re, sys

          version = sys.argv[1]
          text = open("Cargo.lock").read()
          text, count = re.subn(
              r'(\[\[package\]\]\nname = "dcert"\nversion = ")[^"]*(")',
              lambda m: m.group(1) + version + m.group(2),
              text,
              count=1,
          )
          if count != 1:
              sys.exit("Cargo.lock: could not find the dcert package entry")
          open("Cargo.lock", "w").write(text)
          PYEOF

          # Update Python package version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/dcert-cli/pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/dcert-mcp/pyproject.toml
          sed -i "s/\"dcert==[^\"]*\"/\"dcert==$VERSION\"/" python/dcert-mcp/pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" python/dcert-mcp/src/dcert_mcp/__init__.py

          # Commit the version bump
          git config user.name "api-py"
          git config user.email "5954680+api-py@users.noreply.github.com"
          git add Cargo.toml Cargo.lock python/dcert-cli/pyproject.toml python/dcert-mcp/pyproject.toml python/dcert-mcp/src/dcert_mcp/__init__.py
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          # Runs on main queue, so main can move while this one runs. Then
          # this run hands over instead of failing: the run of the newer
          # commit compares with the same release tag and releases both.
          if ! git push origin HEAD:main; then
            echo "::notice::main moved on during this run; the run of the newer commit releases this change"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create and push tag on the version-bump commit
          git tag "$TAG"
          git push origin "$TAG"
          echo "::notice::Created tag $TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux binaries
    # Pin to ubuntu-22.04 so binaries link against GLIBC 2.35 and work on
    # Ubuntu 22.04+.  ubuntu-latest resolves to 24.04 (GLIBC 2.39) which
    # breaks dcert-mcp on older distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs: [ test, auto-tag ]
    if: always() && needs.test.result == 'success' && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped')
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set version from auto-tag
        if: needs.auto-tag.outputs.version != ''
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Set Cargo.toml version to $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-22.04-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-${{ matrix.target }}-cargo-

      - name: Install cargo-auditable
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable

      # Two builds, one per binary; see scripts/ci/build_release.sh.
      - name: Build (release)
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/build_release.sh

      # Fails below the floor in scripts/openssl_floor.yaml or when a dated
      # exception has expired.
      - name: OpenSSL floor
        run: |
          pip install click pyyaml
          python scripts/check_openssl_floor.py dist-bin/dcert

      - name: Package artifact
        run: |
          mkdir -p dist
          tar czf dist/dcert-${{ matrix.target }}.tar.gz -C dist-bin dcert dcert-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcert-${{ matrix.target }}
          path: dist/dcert-${{ matrix.target }}.tar.gz

  build-macos-intel:
    name: Build macOS Intel
    runs-on: macos-15-intel
    timeout-minutes: 45
    needs: [ test, auto-tag ]
    if: always() && needs.test.result == 'success' && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set version from auto-tag
        if: needs.auto-tag.outputs.version != ''
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Set Cargo.toml version to $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-intel-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-intel-cargo-

      - name: Install cargo-auditable
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable

      - name: Build (release)
        env:
          OPENSSL_DIR: /usr/local/opt/openssl@3
          OPENSSL_LIB_DIR: /usr/local/opt/openssl@3/lib
          OPENSSL_INCLUDE_DIR: /usr/local/opt/openssl@3/include
        run: scripts/ci/build_release.sh

      # Fails below the floor in scripts/openssl_floor.yaml or when a dated
      # exception has expired.
      - name: OpenSSL floor
        run: |
          pip install click pyyaml
          # Report only: the macOS binary links the host's OpenSSL dynamically, so
          # the shipped file carries none; this shows what the runner built against.
          python scripts/check_openssl_floor.py --report-only dist-bin/dcert
          otool -L dist-bin/dcert | grep -iE 'ssl|crypto' || echo "no dynamic libssl (statically linked)"

      - name: Package artifact
        run: |
          mkdir -p dist
          tar czf dist/dcert-x86_64-apple-darwin.tar.gz -C dist-bin dcert dcert-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcert-x86_64-apple-darwin
          path: dist/dcert-x86_64-apple-darwin.tar.gz

  build-macos-arm:
    name: Build macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [ test, auto-tag ]
    if: always() && needs.test.result == 'success' && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set version from auto-tag
        if: needs.auto-tag.outputs.version != ''
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          echo "Set Cargo.toml version to $VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm-cargo-

      - name: Install cargo-auditable
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable

      - name: Build (release)
        env:
          OPENSSL_DIR: /opt/homebrew/opt/openssl@3
          OPENSSL_LIB_DIR: /opt/homebrew/opt/openssl@3/lib
          OPENSSL_INCLUDE_DIR: /opt/homebrew/opt/openssl@3/include
        run: scripts/ci/build_release.sh

      # Fails below the floor in scripts/openssl_floor.yaml or when a dated
      # exception has expired.
      - name: OpenSSL floor
        run: |
          pip install click pyyaml
          # Report only: the macOS binary links the host's OpenSSL dynamically, so
          # the shipped file carries none; this shows what the runner built against.
          python scripts/check_openssl_floor.py --report-only dist-bin/dcert
          otool -L dist-bin/dcert | grep -iE 'ssl|crypto' || echo "no dynamic libssl (statically linked)"

      - name: Package artifact
        run: |
          mkdir -p dist
          tar czf dist/dcert-aarch64-apple-darwin.tar.gz -C dist-bin dcert dcert-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcert-aarch64-apple-darwin
          path: dist/dcert-aarch64-apple-darwin.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    needs: [ test, auto-tag ]
    if: always() && needs.test.result == 'success' && (needs.auto-tag.result == 'success' || needs.auto-tag.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set version from auto-tag
        if: needs.auto-tag.outputs.version != ''
        shell: pwsh
        run: |
          $v = "${{ needs.auto-tag.outputs.version }}"
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content Cargo.toml
          Write-Host "Set Cargo.toml version to $v"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # OpenSSL 3.5 LTS is built from the official source with Perl and NASM
      # (Strawberry Perl ships on the runner image) in an MSVC environment;
      # see scripts/ci/build_openssl_windows.ps1 and scripts/openssl_floor.yaml.
      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Verify build prerequisites
        shell: pwsh
        run: |
          where.exe nasm
          where.exe perl
          where.exe nmake

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore the OpenSSL build
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\openssl
          key: openssl-windows-${{ hashFiles('scripts/openssl_floor.yaml', 'scripts/ci/build_openssl_windows.ps1') }}

      - name: Build OpenSSL from the pinned source
        shell: pwsh
        run: |
          pip install pyyaml click
          ./scripts/ci/build_openssl_windows.ps1 -Prefix "$env:RUNNER_TEMP\openssl"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-msvc-cargo-

      - name: Install cargo-auditable
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-auditable

      # Two builds, one per binary, each copied aside straight after its own
      # build; see scripts/ci/build_release.sh for why.
      - name: Build (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "target/x86_64-pc-windows-msvc/release"
          New-Item -ItemType Directory -Force -Path dist-bin | Out-Null
          cargo auditable build --release --target x86_64-pc-windows-msvc --bin dcert
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$rel/dcert.exe" "dist-bin/dcert.exe"
          cargo auditable build --release --target x86_64-pc-windows-msvc --bin dcert-mcp --features mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$rel/dcert-mcp.exe" "dist-bin/dcert-mcp.exe"

      - name: OpenSSL floor
        shell: pwsh
        run: |
          pip install click pyyaml
          python scripts/check_openssl_floor.py dist-bin/dcert.exe

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "dist-bin/dcert.exe","dist-bin/dcert-mcp.exe" `
            -DestinationPath "dist/dcert-x86_64-pc-windows-msvc.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcert-x86_64-pc-windows-msvc
          path: dist/dcert-x86_64-pc-windows-msvc.zip

  # Build platform-specific Python wheels that bundle the Rust binaries
  # The two PyPI projects (docs/plans/2026-11-pypi-split-dcert-mcp.md): `dcert`
  # (the CLI, no Python dependencies) and `dcert-mcp` (the MCP server and the
  # optional proxy). Each platform wheel carries a prebuilt executable, so an
  # install never downloads from GitHub. Built from the real release archives,
  # which runs the glibc check on the real binaries.
  build-platform-wheels:
    name: Build platform wheels
    needs: [ auto-tag, build-linux, build-macos-intel, build-macos-arm, build-windows ]
    if: always() && needs.build-linux.result == 'success' && needs.build-macos-intel.result == 'success' && needs.build-macos-arm.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Build provenance attestations for released wheels.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set Python package versions
        if: needs.auto-tag.outputs.version != ''
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/dcert-cli/pyproject.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" python/dcert-mcp/pyproject.toml
          sed -i "s/\"dcert==[^\"]*\"/\"dcert==$VERSION\"/" python/dcert-mcp/pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" python/dcert-mcp/src/dcert_mcp/__init__.py

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dcert-*
          merge-multiple: true
          path: release-assets/

      - name: List release assets
        run: ls -la release-assets/

      - name: Build the dcert and dcert-mcp wheels
        run: |
          for project in dcert-cli dcert-mcp; do
            python scripts/build_wheels.py \
              --project "python/$project" \
              --archives-dir release-assets/ \
              --output python/platform-dist/
          done
          ls -la python/platform-dist/

      - name: Attest wheel build provenance
        if: needs.auto-tag.outputs.created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: python/platform-dist/*.whl

      - name: Upload platform wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheels-platform
          path: python/platform-dist/*.whl

  # Installs the built wheels the way a user would, on each platform, from the
  # local wheel directory (the packages are not on PyPI yet): `dcert` alone,
  # `dcert-mcp` (which must pull in `dcert` and no third party package), then
  # the `proxy` extra from PyPI.
  wheel-install-test:
    name: Wheel install test (${{ matrix.os }})
    needs: [ build-platform-wheels ]
    if: needs.build-platform-wheels.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-15-intel, macos-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheels-platform
          path: wheels

      - name: Install and run
        shell: bash
        run: python scripts/ci/wheel_install_check.py wheels

  # Docker image reuses the Linux binary from the build-linux job instead
  # of recompiling from source, cutting build time from ~30min to ~30sec.
  # Builds the image from the Linux binary on every run (pull requests too)
  # and scans it, so a vulnerable base layer is caught before it ships.
  image-scan:
    name: Scan Docker image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ build-linux ]
    # auto-tag is skipped on pull requests, and the implicit success() would
    # skip this job with it; scan whenever the Linux build produced a binary.
    if: ${{ !cancelled() && needs.build-linux.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-unknown-linux-gnu
          path: ./docker-bin

      - name: Extract binaries for Docker
        run: |
          cd docker-bin
          tar xzf dcert-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dcert dcert-mcp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: dcert:scan

      # Fixable critical and high findings fail the job; unfixed ones are
      # reported but cannot be acted on until the base image updates.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner binary too; the action only pins its own code.
          version: v0.76.2
          image-ref: dcert:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Visibility only: the scan above hides findings that have no fix yet.
      # This one lists them and never fails the job.
      - name: Trivy report (including unfixed findings)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dcert:scan
          version: v0.76.2
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

  docker:
    name: Build & Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ auto-tag, build-linux, image-scan ]
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing proves the image came from this workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-unknown-linux-gnu
          path: ./docker-bin

      - name: Extract binaries for Docker
        run: |
          cd docker-bin
          tar xzf dcert-x86_64-unknown-linux-gnu.tar.gz
          chmod +x dcert dcert-mcp
          ls -la

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.auto-tag.outputs.version }},enable=${{ needs.auto-tag.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.auto-tag.outputs.created == 'true' }}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Signs the pushed digest (not a tag, which can move) with the
      # workflow's OIDC identity; verify with
      #   cosign verify ghcr.io/scgis-wales/dcert@<digest> \
      #     --certificate-identity-regexp 'https://github.com/SCGIS-Wales/dcert/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  create-homebrew-formula:
    name: Create Homebrew Formula
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, build-linux, build-macos-intel, build-macos-arm ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-unknown-linux-gnu
          path: ./artifacts

      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-apple-darwin
          path: ./artifacts

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-aarch64-apple-darwin
          path: ./artifacts

      - name: Generate Homebrew Formula
        run: |
          VERSION="${{ needs.auto-tag.outputs.version }}"
          TAG="${{ needs.auto-tag.outputs.tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          # Calculate SHA256 checksums
          LINUX_SHA256=$(sha256sum artifacts/dcert-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          MACOS_X86_SHA256=$(sha256sum artifacts/dcert-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          MACOS_ARM_SHA256=$(sha256sum artifacts/dcert-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)

          # Create Homebrew formula with proper structure for tap
          cat > dcert.rb << 'EOF'
          class Dcert < Formula
            desc "TLS certificate decoder, validator, and MCP server"
            homepage "https://github.com/SCGIS-Wales/dcert"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/SCGIS-Wales/dcert/releases/download/vVERSION_PLACEHOLDER/dcert-x86_64-apple-darwin.tar.gz"
                sha256 "MACOS_X86_SHA256_PLACEHOLDER"

                def install
                  bin.install "dcert"
                  bin.install "dcert-mcp"
                end
              end

              on_arm do
                url "https://github.com/SCGIS-Wales/dcert/releases/download/vVERSION_PLACEHOLDER/dcert-aarch64-apple-darwin.tar.gz"
                sha256 "MACOS_ARM_SHA256_PLACEHOLDER"

                def install
                  bin.install "dcert"
                  bin.install "dcert-mcp"
                end
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/SCGIS-Wales/dcert/releases/download/vVERSION_PLACEHOLDER/dcert-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "LINUX_X86_SHA256_PLACEHOLDER"

                def install
                  bin.install "dcert"
                  bin.install "dcert-mcp"
                end
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dcert --version")
            end
          end
          EOF

          # Replace placeholders with actual values
          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" dcert.rb
          sed -i "s|LINUX_X86_SHA256_PLACEHOLDER|$LINUX_SHA256|g" dcert.rb
          sed -i "s|MACOS_X86_SHA256_PLACEHOLDER|$MACOS_X86_SHA256|g" dcert.rb
          sed -i "s|MACOS_ARM_SHA256_PLACEHOLDER|$MACOS_ARM_SHA256|g" dcert.rb

          echo "Generated formula:"
          cat dcert.rb

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          repository: SCGIS-Wales/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          # Copy the generated formula
          cp dcert.rb homebrew-tap/Formula/dcert.rb

          # Commit and push if there are changes
          cd homebrew-tap
          git config user.name "api-py"
          git config user.email "5954680+api-py@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to formula"
          else
            git add Formula/dcert.rb
            git commit -m "Update dcert formula to version ${{ needs.auto-tag.outputs.version }}"
            git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/SCGIS-Wales/homebrew-tap.git"
            git push
          fi

      - name: Upload Homebrew Formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-formula
          path: dcert.rb

  release:
    name: Create GitHub Release
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, test, security-audit, build-linux, build-macos-intel, build-macos-arm, build-windows, create-homebrew-formula, build-platform-wheels ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-unknown-linux-gnu
          path: ./artifacts/dcert-x86_64-unknown-linux-gnu

      - name: Download Windows x86_64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-pc-windows-msvc
          path: ./artifacts/dcert-x86_64-pc-windows-msvc

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-apple-darwin
          path: ./artifacts/dcert-x86_64-apple-darwin

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-aarch64-apple-darwin
          path: ./artifacts/dcert-aarch64-apple-darwin

      - name: Download Homebrew formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-formula
          path: ./artifacts/homebrew-formula

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ./artifacts/sbom

      # The platform wheels, the only Python distributions published: each
      # carries its executable, so an install never downloads from GitHub
      # (blocked in locked down networks). build-platform-wheels already
      # attests their provenance.
      - name: Download platform wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheels-platform
          path: ./artifacts/python

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy binary artifacts
          find artifacts -path artifacts/python -prune -o \( -name "*.tar.gz" -o -name "*.zip" \) -print | while read file; do
            cp "$file" release-assets/
          done
          # Python platform wheels: dcert (CLI) and dcert-mcp (server and proxy)
          ls artifacts/python/*.whl > /dev/null || { echo "::error::no wheels found"; exit 1; }
          if ls artifacts/python/*-none-any.whl > /dev/null 2>&1; then
            echo "::error::a wheel without the binaries reached the release"; exit 1
          fi
          cp artifacts/python/*.whl release-assets/
          # Copy Homebrew formula
          cp artifacts/homebrew-formula/dcert.rb release-assets/
          # CycloneDX SBOMs, one per binary
          for sbom in dcert-cli-sbom.cdx.json dcert-mcp-sbom.cdx.json; do
            test -s "artifacts/sbom/$sbom" || { echo "::error::missing $sbom"; exit 1; }
            cp "artifacts/sbom/$sbom" "release-assets/$sbom"
          done
          # Checksums over every asset, for `sha256sum -c SHA256SUMS`
          (cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Attest release archive build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/dcert-*.tar.gz
            release-assets/dcert-*.zip
            release-assets/dcert-cli-sbom.cdx.json
            release-assets/dcert-mcp-sbom.cdx.json

      - name: Generate release notes
        run: |
          TAG="${{ needs.auto-tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          # Docker repository names must be lower case.
          IMAGE_REPO="${REPO,,}"
          cat > release-notes.md <<EOF
          ## Installation

          ### Homebrew (recommended — macOS and Linux)

          Homebrew is the recommended installation method. The formula installs the prebuilt binaries on macOS (Intel and Apple Silicon) and Linux x86_64 (glibc 2.34 or later).

          \`\`\`bash
          brew install scgis-wales/tap/dcert
          \`\`\`

          ### Python (pip and uv)

          \`\`\`bash
          pip install dcert        # the command line tool
          pip install dcert-mcp    # the MCP server (and dcert)
          pip install "dcert-mcp[proxy]"  # plus the FastMCP proxy and typed client
          uv tool install dcert    # dcert on PATH in its own environment
          uv tool install dcert-mcp --with-executables-from dcert
          uvx dcert example.com    # run once without installing
          \`\`\`

          Each wheel carries a prebuilt executable, so nothing is downloaded at install or run time, and \`dcert\` installs no Python dependency. The same wheels are attached to this release for offline and mirror installs:

          | Platform | Wheel suffix |
          | --- | --- |
          | Linux x86_64 (glibc 2.34+: RHEL 9, Ubuntu 22.04, Debian 12 and later) | \`py3-none-manylinux_2_34_x86_64.whl\` |
          | macOS Intel (10.15+) | \`py3-none-macosx_10_15_x86_64.whl\` |
          | macOS Apple Silicon (11+) | \`py3-none-macosx_11_0_arm64.whl\` |
          | Windows x86_64 | \`py3-none-win_amd64.whl\` |

          \`\`\`bash
          pip install dcert-${TAG#v}-py3-none-manylinux_2_34_x86_64.whl
          pip install dcert_mcp-${TAG#v}-py3-none-manylinux_2_34_x86_64.whl
          \`\`\`

          ### Prebuilt binaries

          Prebuilt Linux binaries need glibc 2.34 and OpenSSL 3: **RHEL 9**, **Ubuntu 22.04**, **Debian 12** or later.

          \`\`\`bash
          # macOS (Intel)
          curl -L https://github.com/${REPO}/releases/download/${TAG}/dcert-x86_64-apple-darwin.tar.gz | tar xz
          chmod +x dcert dcert-mcp && sudo mv dcert dcert-mcp /usr/local/bin/

          # macOS (Apple Silicon)
          curl -L https://github.com/${REPO}/releases/download/${TAG}/dcert-aarch64-apple-darwin.tar.gz | tar xz
          chmod +x dcert dcert-mcp && sudo mv dcert dcert-mcp /usr/local/bin/

          # Linux (x86_64, glibc 2.34+)
          curl -L https://github.com/${REPO}/releases/download/${TAG}/dcert-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x dcert dcert-mcp && sudo mv dcert dcert-mcp /usr/local/bin/
          \`\`\`

          ### Windows

          Install with Chocolatey:

          \`\`\`powershell
          choco install dcert
          \`\`\`

          Or download the prebuilt binaries (x86_64):

          \`\`\`powershell
          # Extract dcert.exe and dcert-mcp.exe from the archive and add them to your PATH
          curl -L -o dcert.zip https://github.com/${REPO}/releases/download/${TAG}/dcert-x86_64-pc-windows-msvc.zip
          Expand-Archive dcert.zip -DestinationPath .
          \`\`\`

          ### Docker

          \`\`\`bash
          # The MCP server over stdio (the image's entrypoint)
          docker pull ghcr.io/${IMAGE_REPO}:${TAG#v}
          docker run --rm -i ghcr.io/${IMAGE_REPO}:${TAG#v}
          # The command line tool
          docker run --rm --entrypoint dcert ghcr.io/${IMAGE_REPO}:${TAG#v} https://www.google.com
          \`\`\`

          ### Verifying downloads

          \`\`\`bash
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify dcert-x86_64-unknown-linux-gnu.tar.gz --repo ${REPO}
          \`\`\`

          The container image is signed with cosign (keyless); the CycloneDX SBOMs are \`dcert-cli-sbom.cdx.json\` and \`dcert-mcp-sbom.cdx.json\`.
          EOF

      - name: Delete existing draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.auto-tag.outputs.tag }}"
          # Delete any stale draft releases for this tag to avoid conflicts
          gh api "repos/${{ github.repository }}/releases" --jq \
            ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id" \
          | while read -r DRAFT_ID; do
            echo "Deleting draft release (id=${DRAFT_ID})..."
            gh api -X DELETE "repos/${{ github.repository }}/releases/${DRAFT_ID}"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.auto-tag.outputs.tag }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists, updating..."
            gh release edit "${TAG}" \
              --notes-file release-notes.md \
              --latest
            gh release upload "${TAG}" \
              --clobber \
              release-assets/*
          else
            echo "Creating new release ${TAG}..."
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --generate-notes \
              --latest \
              release-assets/*
          fi

  # Integration test for the Chocolatey package. Packs the package against the
  # latest published release, installs it, verifies dcert.exe / dcert-mcp.exe
  # run from the generated PATH shims, then uninstalls and verifies cleanup.
  # Runs on every push/PR (NOT gated on a new tag) so the install/uninstall
  # scripts are exercised before they ship. The new version under development
  # has no release yet, so this smoke-tests the scripts against the most recent
  # real release — which is exactly what changes in a packaging PR.
  test-chocolatey-package:
    name: Test Chocolatey package (install/uninstall)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The newest release that already carries the Windows zip. A tag alone
      # is not enough: the release pipeline pushes the tag before it uploads
      # the assets, and a run that starts in between would download nothing.
      - name: Resolve latest released version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $null
          $releases = gh release list --repo "${{ github.repository }}" --limit 10 --exclude-drafts --json tagName |
            ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tagName -notmatch '^v\d+\.\d+\.\d+$') { continue }
            $assets = (gh release view $release.tagName --repo "${{ github.repository }}" --json assets |
              ConvertFrom-Json).assets.name
            if ($assets -contains 'dcert-x86_64-pc-windows-msvc.zip') { $tag = $release.tagName; break }
          }
          if (-not $tag) {
            Write-Host "::notice::No release tag found — skipping Chocolatey install test."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $version = $tag.TrimStart('v')
          Write-Host "Latest released version: $version (tag $tag)"
          "skip=false"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download release zip and compute SHA256
        if: steps.ver.outputs.skip == 'false'
        id: sha
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.ver.outputs.version }}"
          $url = "https://github.com/SCGIS-Wales/dcert/releases/download/v$version/dcert-x86_64-pc-windows-msvc.zip"
          $zip = "dcert-windows.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "sha256=$hash"
          "sha=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Mirrors the templating in create-chocolatey-package: substitute the
      # version + checksum placeholders into the checked-out package files.
      - name: Template nuspec and install script
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $sha = "${{ steps.sha.outputs.sha }}"
          $files = @(
            "packaging/chocolatey/dcert.nuspec",
            "packaging/chocolatey/tools/chocolateyInstall.ps1"
          )
          foreach ($f in $files) {
            (Get-Content $f) -replace '__VERSION__', $version -replace '__SHA256__', $sha | Set-Content $f
          }

      - name: Choco pack
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: choco pack packaging/chocolatey/dcert.nuspec --outputdirectory dist-choco

      - name: Choco install from local source
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: choco install dcert --source "dist-choco" --yes --no-progress

      - name: Verify installed binaries run
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv
          foreach ($exe in @('dcert', 'dcert-mcp')) {
            Write-Host "Checking $exe --version ..."
            $out = & $exe --version 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "$exe --version exited with code $LASTEXITCODE" }
          }
          Write-Host "Both binaries run from the Chocolatey shims."

      - name: Choco uninstall and verify cleanup
        if: steps.ver.outputs.skip == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco uninstall dcert --yes
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall exited with code $LASTEXITCODE" }
          foreach ($exe in @('dcert.exe', 'dcert-mcp.exe')) {
            $shim = Join-Path "$env:ChocolateyInstall\bin" $exe
            if (Test-Path $shim) { throw "Shim still present after uninstall: $shim" }
          }
          Write-Host "Uninstall verified — shims removed."

  # Pack the Chocolatey package (unprivileged — no secret here). Always
  # produces the .nupkg artifact, even if publishing is later skipped/fails.
  create-chocolatey-package:
    name: Create Chocolatey package
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, build-windows, release ]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-x86_64-pc-windows-msvc
          path: ./artifacts

      - name: Template nuspec and install script
        shell: pwsh
        run: |
          $version = "${{ needs.auto-tag.outputs.version }}"
          $zip = "artifacts/dcert-x86_64-pc-windows-msvc.zip"
          if (-not (Test-Path $zip)) { throw "Windows artifact not found: $zip" }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "version=$version sha256=$sha"
          $files = @(
            "packaging/chocolatey/dcert.nuspec",
            "packaging/chocolatey/tools/chocolateyInstall.ps1"
          )
          foreach ($f in $files) {
            (Get-Content $f) -replace '__VERSION__', $version -replace '__SHA256__', $sha | Set-Content $f
          }

      - name: Verify placeholders were substituted
        shell: pwsh
        run: |
          $bad = Select-String -Path "packaging/chocolatey/dcert.nuspec","packaging/chocolatey/tools/chocolateyInstall.ps1" -Pattern '__VERSION__|__SHA256__'
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_.Line }
            throw "Unsubstituted placeholders remain in the Chocolatey package — aborting."
          }
          Write-Host "All placeholders substituted."

      - name: Choco pack
        shell: pwsh
        run: choco pack packaging/chocolatey/dcert.nuspec --outputdirectory dist-choco

      - name: Verify exactly one nupkg
        shell: pwsh
        run: |
          $pkgs = @(Get-ChildItem dist-choco/*.nupkg)
          if ($pkgs.Count -ne 1) { throw "Expected exactly one .nupkg, found $($pkgs.Count)." }
          Write-Host "Packed: $($pkgs[0].Name)"

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dcert-chocolatey
          path: dist-choco/*.nupkg

  # Publish to chocolatey.org. Isolated job that holds the secret and does
  # nothing but push — idempotent (a version that already exists is treated as
  # success) and retried on transient failures.
  publish-chocolatey:
    name: Publish to Chocolatey
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, create-chocolatey-package ]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - name: Download nupkg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dcert-chocolatey
          path: ./dist-choco

      - name: Push to chocolatey.org (idempotent, with retry)
        if: env.CHOCO_API_KEY != ''
        shell: pwsh
        run: |
          # Native command stderr must not throw under 'Stop'; rely on exit code.
          $ErrorActionPreference = 'Continue'
          $nupkg = Get-ChildItem dist-choco/*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "No .nupkg found to publish." }
          Write-Host "Publishing $($nupkg.Name) to chocolatey.org"

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Push attempt $attempt of $maxAttempts..."
            # --api-key is passed inline (never echoed); GitHub masks the secret in logs.
            $output = choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY --timeout 300 2>&1
            $code = $LASTEXITCODE
            $text = $output | Out-String
            Write-Host $text

            if ($code -eq 0) {
              Write-Host "Push succeeded."
              exit 0
            }

            # Idempotency: a version already on the feed is not a failure.
            if ($text -match '(?i)already exists|version.*exists|409|conflict') {
              Write-Host "Version already published on chocolatey.org — treating as success (idempotent)."
              exit 0
            }

            # Auth/permission errors should fail fast rather than retry.
            if ($text -match '(?i)403|forbidden|unauthorized|invalid api key') {
              throw "Authorization error from chocolatey.org — failing fast (check/rotate CHOCO_API_KEY)."
            }

            if ($attempt -lt $maxAttempts) {
              $delay = $attempt * 15
              Write-Host "Transient failure (exit $code). Retrying in $delay s..."
              Start-Sleep -Seconds $delay
            }
          }
          throw "choco push failed after $maxAttempts attempts."

      - name: Note when publish is skipped
        if: env.CHOCO_API_KEY == ''
        shell: pwsh
        run: Write-Host "CHOCO_API_KEY secret not set — skipping chocolatey.org publish (the .nupkg artifact is still available)."

  publish-pypi-dcert:
    name: Publish dcert to PyPI
    if: needs.auto-tag.outputs.created == 'true'
    needs: [ auto-tag, release, python-lint, python-mcp, build-platform-wheels, integration-test, wheel-install-test ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    # Its own environment, so the OIDC claims of this job match exactly one
    # PyPI trusted publisher (dcert). With one environment for both projects
    # PyPI minted a token valid for dcert-mcp only and refused the dcert upload.
    environment:
      name: pypi-dcert
      url: https://pypi.org/project/dcert/
    steps:
      # Only platform wheels, each with its executable: on a host no wheel fits,
      # pip fails with "no matching distribution" instead of installing a
      # package that must download a binary at run time.
      - name: Download platform wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-wheels-platform
          path: all/

      - name: Select the dcert distributions
        run: |
          mkdir dist
          cp all/dcert-[0-9]*.whl dist/
          ls -la dist/
          [ "$(ls dist/*.whl | wc -l)" -eq 4 ] || { echo "::error::expected 4 wheels"; exit 1; }
          if ls dist/*-none-any.whl dist/*.tar.gz > /dev/null 2>&1; then
            echo "::error::only platform wheels with bundled binaries are published"; exit 1
          fi

      # PyPI publishing occasionally fails on transient upstream errors — most
      # often a 5xx from the Sigstore Rekor transparency log while generating
      # PEP 740 attestations (e.g. "Rekor returned an unknown error with HTTP
      # 502"). Retry the publish with exponential backoff instead of failing the
      # release. Every attempt uses the official trusted-publisher action (OIDC)
      # with skip-existing, so files uploaded by an earlier partial attempt are
      # skipped rather than causing a hard error on the next try.
      - name: Publish to PyPI (attempt 1)
        id: publish1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Backoff before attempt 2
        if: steps.publish1.outcome == 'failure'
        run: echo "Attempt 1 failed (likely transient). Waiting 30s before retry..." && sleep 30

      - name: Publish to PyPI (attempt 2)
        id: publish2
        if: steps.publish1.outcome == 'failure'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Backoff before attempt 3
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        run: echo "Attempt 2 failed (likely transient). Waiting 60s before final retry..." && sleep 60

      # Final attempt: NOT continue-on-error, so a persistent failure here
      # (i.e. a real problem rather than a transient blip) fails the job.
      - name: Publish to PyPI (attempt 3, final)
        if: steps.publish1.outcome == 'failure' && steps.publish2.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

  publish-pypi-mcp:
    name: Publish dcert-mcp to PyPI
    # After the dcert wheels: dcert-mcp requires dcert==<same version>.
    if: needs.auto-tag.outputs.created == 'true'
