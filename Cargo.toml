[package]
name = "dcert"
version = "3.0.76"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/SCGIS-Wales/dcert"
description = "TLS certificate analysis, format conversion, and key verification — CLI and MCP server"
readme = "README.md"
default-run = "dcert"
build = "build.rs"

[[bin]]
name = "dcert"
path = "src/main.rs"

[[bin]]
name = "dcert-mcp"
path = "src/mcp/main.rs"

[dependencies]

pem-rfc7468 = { version = "1.0", features = ["alloc"] }
url = "2.5"
base64 = "0.23"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x509-parser = "0.18"
openssl = "0.10"
# Direct dependency so Cargo exposes openssl-sys's `links` metadata
# (DEP_OPENSSL_VERSION_NUMBER) to build.rs, and for the one FFI call the safe
# crate does not wrap yet (the negotiated TLS group name).
openssl-sys = "0.9"
foreign-types = "0.3"
pem = "4.0"
serde_norway = "0.9"
ctrlc = "3.5"
openssl-probe = "0.2"
rmcp = { version = "3.7", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "client",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-std",
    "sync",
    "time",
    "signal",
] }
schemars = "1.2"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# reqwest 0.13 replaced 0.12's `rustls-tls-native-roots`: `rustls` now pulls in
# rustls-platform-verifier, so the platform trust store is used by default and
# the separate native-roots feature no longer exists. `form` also became its own
# feature; the OBO token exchange posts a urlencoded form body.
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "rustls",
    "blocking",
], default-features = false }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex-lite = "0.1"
subtle = "2.6"
tempfile = "3.27"
percent-encoding = "2.3"
rust_xlsxwriter = "0.101"
zeroize = { version = "1.9", features = ["derive"] }
webpki-root-certs = "1"
rpassword = "7.5"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"] }
tokio-util = "0.7.20"

# Windows has no system OpenSSL. Build it from source via the `vendored`
# feature (gated to Windows so Linux/macOS keep using system/Homebrew OpenSSL).
# The vendored build requires Perl and NASM on the build machine (CI installs them).
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = []
# Build and statically link OpenSSL from source (openssl-src) instead of the
# system library. Useful on hosts whose OpenSSL predates 3.5 (no ML-KEM) or
# where no development headers are installed. Requires Perl (and NASM on
# Windows). Enabled on Windows automatically through the target dependency.
vendored = ["openssl/vendored"]

[dev-dependencies]
wiremock = "0.6"
# Lets the CLI integration tests stand up a real loopback TLS server, so the
# --resolve / --connect-to overrides are exercised end to end rather than only
# at the argument-parsing layer.
openssl = "0.10"


[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Correctness and suspicious lints are deny by default; these raise the floor
# for the rest of the codebase without adopting the whole pedantic group.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
