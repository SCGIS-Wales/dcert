[package]
name = "dcert"
version = "4.0.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/SCGIS-Wales/dcert"
description = "TLS certificate analysis, format conversion, and key verification — CLI and MCP server"
readme = "README.md"
default-run = "dcert"
build = "build.rs"

[[bin]]
name = "dcert"
path = "src/main.rs"

[[bin]]
name = "dcert-mcp"
path = "src/mcp/main.rs"
required-features = ["mcp"]

[dependencies]

pem-rfc7468 = { version = "1.0", features = ["alloc"] }
url = "2.5"
base64 = "0.23"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x509-parser = "0.18"
openssl = "0.10"
# Direct dependency so Cargo exposes openssl-sys's `links` metadata
# (DEP_OPENSSL_VERSION_NUMBER) to build.rs, and for the one FFI call the safe
# crate does not wrap yet (the negotiated TLS group name).
openssl-sys = "0.9"
foreign-types = "0.3"
pem = "4.0"
serde_norway = "0.9"
ctrlc = "3.5"
openssl-probe = "0.2.2"
# MCP server only. Optional so the dcert CLI is built and audited without them;
# the `mcp` feature switches them on for the dcert-mcp binary.
rmcp = { version = "3.11", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "client",
], optional = true }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-std",
    "sync",
    "time",
    "signal",
], optional = true }
schemars = { version = "1.2", optional = true }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"], optional = true }
# HTTP for the CLI (AIA issuers, public roots, Vault): ureq over the OpenSSL
# already linked for the probe, so the CLI carries one TLS implementation.
# `src/http.rs` supplies the TLS connector; no ureq TLS feature is enabled.
ureq = { version = "3.5", default-features = false, features = ["json"] }
# The MCP server's async HTTP (OIDC discovery, JWKS, token exchange). reqwest
# 0.13's `rustls` uses the platform trust store; `form` posts the OBO exchange.
reqwest = { version = "0.13", features = [
    "json",
    "form",
    "rustls",
], default-features = false, optional = true }
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["cors", "limit", "timeout", "trace"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
regex-lite = "0.1"
subtle = { version = "2.6", optional = true }
tempfile = "3.27"
percent-encoding = "2.3"
# Excel export for `dcert vault list`. On by default, removable for a smaller build.
rust_xlsxwriter = { version = "0.103", optional = true }
zeroize = { version = "1.9", features = ["derive"] }
webpki-root-certs = "1"
rpassword = "7.5"
tower = { version = "0.5.3", features = ["limit", "timeout", "util"], optional = true }
tokio-util = { version = "0.7.20", optional = true }

# Windows has no system OpenSSL. The release build links a static OpenSSL 3.5
# that CI builds from the official source (scripts/ci/build_openssl_windows.ps1)
# and exposes through OPENSSL_DIR and OPENSSL_STATIC=1. To build on Windows
# yourself, point OPENSSL_DIR at an OpenSSL install, or use `--features vendored`
# (needs Perl and NASM).

[features]
default = ["xlsx"]
# Everything the dcert-mcp binary needs. Build it with
# `cargo build --bin dcert-mcp --features mcp`; the dcert CLI is built without.
mcp = [
    "dep:reqwest",
    "dep:rmcp",
    "dep:tokio",
    "dep:jsonwebtoken",
    "dep:axum",
    "dep:tower-http",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tokio-util",
    "dep:subtle",
    "dep:schemars",
]
# Excel export for `dcert vault list --export file.xlsx`.
xlsx = ["dep:rust_xlsxwriter"]
# Build and statically link OpenSSL from source (openssl-src) instead of the
# system library. Useful on hosts whose OpenSSL predates 3.5 (no ML-KEM) or
# where no development headers are installed. Requires Perl (and NASM on
# Windows). Enabled on Windows automatically through the target dependency.
vendored = ["openssl/vendored"]

# The OS trust store for the HTTP client where OpenSSL cannot read it (the
# Windows certificate store, the macOS keychain); see src/http.rs.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
wiremock = "0.6"
# Lets the CLI integration tests stand up a real loopback TLS server, so the
# --resolve / --connect-to overrides are exercised end to end rather than only
# at the argument-parsing layer.
openssl = "0.10"


[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Correctness and suspicious lints are deny by default; these raise the floor
# for the rest of the codebase without adopting the whole pedantic group.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
