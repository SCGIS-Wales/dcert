# Pin the toolchain to a recent stable for reproducible builds across all
# platforms (Linux, macOS, Windows). The crate's MSRV support floor remains
# `rust-version = "1.85"` in Cargo.toml; this pin is what we build/ship with.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
