# Packaged configuration for the dcert Python wrapper.
#
# Every value here is a default. Runtime settings under "resilience" and
# "otel" can be overridden with the DCERT_MCP_* environment variables listed
# in dcert/resilience.py, and the CLI flags of dcert-mcp-proxy override those.

binaries:
  # Environment variable that points at an explicit path for each of the
  # Rust binaries shipped in a release.
  env:
    dcert: DCERT_PATH
    dcert-mcp: DCERT_MCP_BINARY
  # Variable named in the "binary not found" message for a name without a
  # row above.
  fallback_env: DCERT_MCP_BINARY
  # Bytes read from the head of a candidate file to tell a pip console
  # script wrapper ("#!...python") from a compiled binary.
  wrapper_probe_bytes: 128

subprocess:
  # Environment variables forwarded from the proxy to the Rust subprocess.
  # An entry ending in "*" forwards every variable with that prefix.
  passthrough_env:
    - HOME
    - USER
    - PATH
    - TMPDIR
    - XDG_CACHE_HOME
    - LD_LIBRARY_PATH
    - DYLD_LIBRARY_PATH
    - DYLD_FALLBACK_LIBRARY_PATH
    - HTTP_PROXY
    - HTTPS_PROXY
    - NO_PROXY
    - ALL_PROXY
    - http_proxy
    - https_proxy
    - no_proxy
    - all_proxy
    - SSL_CERT_FILE
    - SSL_CERT_DIR
    - REQUESTS_CA_BUNDLE
    - DCERT_PATH
    - DCERT_PROXY
    - DCERT_NOPROXY
    - DCERT_KB_FILE
    - DCERT_MCP_*
    - VAULT_ADDR
    - VAULT_TOKEN
    - VAULT_CACERT
    - VAULT_CAPATH
    - VAULT_SKIP_VERIFY

server:
  name: dcert-mcp
  host: 127.0.0.1
  port: 8080
  # Transports dcert-mcp-proxy accepts and the one used when none is given.
  transports:
    - stdio
    - http
    - sse
  default_transport: stdio
  # Host header values HTTP and SSE mode always accept; --allowed-hosts adds
  # more. Anything else is answered 400, which defeats DNS rebinding from a
  # browser.
  loopback_hosts:
    - 127.0.0.1
    - localhost
    - "::1"
  # HTTP and SSE mode refuse to start without one of these. The variable
  # names match the Rust server's, so one environment configures both.
  auth:
    token_env: DCERT_MCP_AUTH_TOKEN
    oidc_issuer_env: DCERT_MCP_OIDC_ISSUER
    oidc_audience_env: DCERT_MCP_OIDC_AUDIENCE
    oidc_jwks_env: DCERT_MCP_OIDC_JWKS_URL
    # A shorter static token is refused as guessable.
    min_token_length: 32

resilience:
  tool_timeout: 300.0
  # Seconds allowed to start the subprocess and complete the MCP handshake,
  # and to look up a tool's annotations.
  connect_timeout: 30.0
  reconnect_max: 3
  retry_max_attempts: 3
  retry_base_delay: 0.5
  retry_max_delay: 10.0
  retry_multiplier: 1.5
  circuit_breaker_threshold: 5
  circuit_breaker_reset_timeout: 30.0
  rate_limit_rps: 10.0
  rate_limit_burst: 20
  bulkhead_max: 10
  cache_tool_ttl: 300
  cache_list_ttl: 60
  # 256 KiB; 0 disables truncation.
  max_response_bytes: 262144
  # A truncation cut is moved back to the last newline within this many
  # characters so output is not broken mid line.
  truncation_lookback_chars: 200

otel:
  service_name: dcert-mcp
  exporter: console
  # Exporters dcert-mcp-proxy accepts.
  exporters:
    - console
    - otlp

tools:
  # truststore_password, keystore_alias, expiry_days and output_dir mirror
  # src/limits.rs; scripts/sync_defaults.py writes them and CI checks them.
  # Default password applied by the Rust server to new truststores.
  truststore_password: "changeit"
  keystore_alias: "server"
  expiry_days: 30
  # Directory convert_pfx_to_pem writes PEM files to when none is given.
  output_dir: "."
