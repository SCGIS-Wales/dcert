sonar.projectKey=dcert
sonar.projectName=dcert
sonar.sources=src,python/dcert-mcp/src
sonar.tests=python/dcert-mcp/tests
sonar.python.version=3.12

# Rust sources (SonarQube treats .rs as generic text)
sonar.inclusions=src/**/*.rs,python/dcert-mcp/src/**/*.py,python/dcert-mcp/tests/**/*.py
sonar.exclusions=target/**,python/dcert-mcp/.venv/**,python/platform-dist/**

# Python coverage
sonar.python.coverage.reportPaths=python/dcert-mcp/coverage.xml
