# Dependency budget for the dcert CLI binary (security plan, objective O3).
# Read by scripts/check_cli_deps.py. The CLI is built without the `mcp`
# feature, so none of the MCP only crates may appear in its tree.

# Arguments added to `cargo tree` to select the CLI feature set. Empty features
# means the defaults, which include `xlsx`. The target is pinned so the count
# does not depend on the machine that runs the check.
cargo_args: ["--target", "x86_64-unknown-linux-gnu"]

# Upper bound on unique crates (`name version`) in the normal dependency tree.
max_crates: 135

# false: report only. true: exit 1 on a violation.
enforce: true

# Crates that must not be in the CLI tree.
banned_crates:
  - rmcp
  - rmcp-macros
  - axum
  - axum-core
  - jsonwebtoken
  - rsa
  - crypto-bigint
  - chrono
  - tracing-subscriber
  # S4b: the CLI speaks HTTP through ureq over OpenSSL (src/http.rs), so it
  # carries no second TLS stack and no async runtime.
  - reqwest
  - hyper
  - tokio
  - rustls
  - aws-lc-rs
  - aws-lc-sys
  - ring
