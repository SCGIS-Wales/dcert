# Sources of the trust anchors embedded in src/trust_anchors/ for root trust
# classification (src/trust_programs.rs). Recognising a root here never makes
# dcert trust it for a TLS connection; it only names the trust program a chain
# belongs to. scripts/gen_trust_anchors.py writes the Mozilla email set and,
# with --check, verifies every embedded file against this list.

mozilla_email:
  # Roots Mozilla trusts for email (S/MIME) and not for websites, from NSS's
  # certdata.txt at a release tag. Roots trusted for websites are in
  # webpki-root-certs already. Roots with an email distrust date are left out.
  nss_tag: NSS_3_134_RTM
  url: https://raw.githubusercontent.com/nss-dev/nss/{tag}/lib/ckfw/builtins/certdata.txt
  sha256: 6d177e33ab54b338edfee24dc3868585833636716a320a725137ab4a15927292
  output: src/trust_anchors/mozilla_email.pem

